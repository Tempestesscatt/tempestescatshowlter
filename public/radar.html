<script type="module">
import radarDefault, * as radarNs from '/js/radar.js';
const radar = { ...radarDefault, ...radarNs };

if (!radar.pauseRadarAnimation && radar.stopAllAnimations) radar.pauseRadarAnimation = radar.stopAllAnimations;
if (!radar.resumeRadarAnimation && radar.startAllAnimations) radar.resumeRadarAnimation = radar.startAllAnimations;

import { initValor } from '/dades/valor.js';
import { SCALES } from '/dades/escales.js';
import { initAutoReload } from '/dades/autoreload.js';
import { initEstacions } from '/js/estacions.js';
import { initAlertes } from '/js/alertes.js';
import { initLitres } from '/js/litres.js';

/* ===================== Helpers ===================== */
const $ = (id) => document.getElementById(id);
const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const setStatus = (t) => { const el = $('statusText'); if (el) el.textContent = t || ''; };

/* ===================== Loader ===================== */
const loader = $('loader'), loaderFill = $('loaderFill'), loaderText = $('loaderText');
function setLoad(pct, text) {
  if (loaderFill) loaderFill.style.width = Math.max(0, Math.min(100, pct)) + '%';
  if (text && loaderText) loaderText.textContent = text;
}
function hideLoader() {
  if (!loader) return;
  loader.classList.add('hide');
  setTimeout(() => loader.remove(), 400);
}
setLoad(10, 'Preparant el mapa…');

/* ===================== Config ===================== */
const MAP_CENTER = [1.5, 41.7];
const MAP_ZOOM = 6.4;
const BASEMAPS = {
  clar: 'https://tiles.openfreemap.org/styles/positron',
  fosc: 'https://tiles.openfreemap.org/styles/dark',
};

const PRODUCTS = {
  dbz: { label: 'Reflectivitat (dBZ)', scale: SCALES.dbz, chip: 'dBZ' },
  vel: { label: 'Velocitat radial (m/s)', scale: SCALES.vel, chip: 'm/s' },
};

/* ===================== Estat ===================== */
let currentTheme = 'fosc';
try { currentTheme = localStorage.getItem('radar.theme') === 'clar' ? 'clar' : 'fosc'; } catch (e) {}

let uiPaused = false;
let radarOn = true;
let totalFrames = 0;
let activeKey = 'dbz';
let timestamps = [];
let intervalMin = 5;
let lastRendered = -1;
let dragging = false;
let minIndex = 0;
let lockPct = 0;
let lockPrompted = false;
let appReady = false;
let switchSeq = 0;
let lastRadarMs = null;
let litres = null;

const TIERS = ['anon', 'free', 'entusiasta', 'professional'];
const ACCESS = {
  anon:         { minutes: 25,       name: 'Sense sessió', window: '25 minuts' },
  free:         { minutes: 60,       name: 'Compte gratuït', window: '1 hora' },
  entusiasta:   { minutes: 180,      name: 'Entusiasta', window: '3 hores' },
  professional: { minutes: Infinity, name: 'Professional', window: '24 hores i arxiu' },
};
let tier = 'anon';
let planLabel = '';
let currentUser = null;

let stopAutoReload = null;

/* ===================== Mapa ===================== */
const map = new maplibregl.Map({
  container: 'map',
  style: BASEMAPS[currentTheme],
  center: MAP_CENTER,
  zoom: MAP_ZOOM,
  pitch: 0,
  bearing: 0,
  attributionControl: false,
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: false }), 'top-right');
map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-right');

function hideBaseLabels() {
  const style = map.getStyle();
  if (!style) return;
  for (const l of style.layers) {
    if (l.type === 'symbol') {
      try { map.setLayoutProperty(l.id, 'visibility', 'none'); } catch (e) {}
    }
  }
}

/* ===================== Estacions & alertes ===================== */
const estacions = initEstacions({ map, visible: false });
const alertes = initAlertes({ map, visible: true });

/* ===================== FLYOUTS ===================== */
const UI = { open: null };
function closeAllFlyouts() {
  document.querySelectorAll('.flyout.open').forEach((f) => f.classList.remove('open'));
  document.querySelectorAll('.rail-btn.active').forEach((b) => {
    if (b.dataset.flyout) b.classList.remove('active');
  });
  UI.open = null;
}
function positionFlyout(flyout, anchorBtn) {
  const rect = anchorBtn.getBoundingClientRect();
  const isRight = anchorBtn.closest('.side-rail.right');
  flyout.style.top = Math.max(12, rect.top) + 'px';
  flyout.style.left = ''; flyout.style.right = '';
  if (isRight) flyout.style.right = (window.innerWidth - rect.left + 8) + 'px';
  else flyout.style.left = (rect.right + 8) + 'px';
  requestAnimationFrame(() => {
    const fh = flyout.offsetHeight;
    if (rect.top + fh > window.innerHeight - 12) {
      flyout.style.top = Math.max(12, window.innerHeight - fh - 12) + 'px';
    }
  });
}
function openFlyout(id, btn) {
  const flyout = document.getElementById('flyout-' + id);
  if (!flyout || !btn) return;
  closeAllFlyouts();
  flyout.classList.add('open');
  positionFlyout(flyout, btn);
  btn.classList.add('active');
  UI.open = id;
}
function bindFlyoutTriggers() {
  document.querySelectorAll('.rail-btn[data-flyout]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (UI.open === btn.dataset.flyout) closeAllFlyouts();
      else openFlyout(btn.dataset.flyout, btn);
    });
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.flyout') && !e.target.closest('.rail-btn')) closeAllFlyouts();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeAllFlyouts(); closeUpsell(); } });
  window.addEventListener('resize', () => {
    if (!UI.open) return;
    const btn = document.querySelector(`.rail-btn[data-flyout="${UI.open}"]`);
    const flyout = document.getElementById('flyout-' + UI.open);
    if (btn && flyout) positionFlyout(flyout, btn);
  });
}

/* ===================== Leyenda ===================== */
function legendPct(p, v) {
  if (p.log) return ((Math.log10(v) - Math.log10(p.min)) / (Math.log10(p.max) - Math.log10(p.min))) * 100;
  return ((v - p.min) / (p.max - p.min)) * 100;
}
function paintLegend(p, title) {
  $('legendTitle').textContent = title;
  const stops = p.stops.map(([v, c]) => `rgb(${c[0]},${c[1]},${c[2]}) ${legendPct(p, v).toFixed(1)}%`).join(', ');
  $('legendBar').style.background = `linear-gradient(to top, ${stops})`;
  $('legendTicks').innerHTML = p.ticks.map((v) => `<span class="legend-tick" style="bottom:${legendPct(p, v).toFixed(1)}%">${v}</span>`).join('');
}
const renderLegend = (key) => paintLegend(PRODUCTS[key].scale, PRODUCTS[key].scale.title);

/* ===================== Tema ===================== */
function applyTheme(theme) {
  if (theme === currentTheme) return;
  currentTheme = theme;
  try { localStorage.setItem('radar.theme', theme); } catch (e) {}
  document.querySelectorAll('#flyout-mapSelect .opt').forEach((o) => o.classList.toggle('selected', o.dataset.theme === theme));
  radar.setBaseTheme(theme);
  map.setStyle(BASEMAPS[theme], { diff: false });
  map.once('style.load', async () => {
    hideBaseLabels();
    await radar.reapplyLayers();
    await estacions.start().catch(() => {});
    await alertes.start().catch(() => {});
  });
}
document.querySelectorAll('#flyout-mapSelect .opt').forEach((o) => {
  o.addEventListener('click', () => { applyTheme(o.dataset.theme); closeAllFlyouts(); });
});

/* ===================== Timeline ===================== */
const hourFmt = new Intl.DateTimeFormat('ca-ES', { timeZone: 'Europe/Madrid', hour: '2-digit', minute: '2-digit' });
const dayFmt = new Intl.DateTimeFormat('ca-ES', { timeZone: 'Europe/Madrid', day: '2-digit', month: 'short', year: 'numeric' });
const hourOnlyFmt = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Madrid', hour: '2-digit', hour12: false });
const minuteOnlyFmt = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Madrid', minute: '2-digit' });

function rebuildTimelineLabels() {
  const tl = $('timelineLabels');
  if (!tl) return;
  tl.innerHTML = '';
  if (totalFrames === 0) return;
  const totalH = (totalFrames * intervalMin) / 60;
  const stepH = totalH <= 4 ? 1 : totalH <= 12 ? 2 : totalH <= 24 ? 3 : totalH <= 48 ? 6 : 12;
  for (let i = 0; i < totalFrames; i++) {
    const d = timestamps[i];
    if (!d) continue;
    const h = Number(hourOnlyFmt.format(d)) % 24;
    const m = Number(minuteOnlyFmt.format(d));
    if (m === 0 && h % stepH === 0) {
      const el = document.createElement('div');
      el.className = 'timeline-label';
      el.style.left = (totalFrames > 1 ? (i / (totalFrames - 1)) * 100 : 0) + '%';
      el.textContent = String(h).padStart(2, '0') + 'h';
      tl.appendChild(el);
    }
  }
}

function updateUI(index) {
  if (index === lastRendered) return;
  lastRendered = index;
  const d = timestamps[index];
  $('timeCurrent').textContent = d ? hourFmt.format(d) : '—';
  $('timeDate').textContent = d ? dayFmt.format(d) : '—';
  const pct = totalFrames > 1 ? (index / (totalFrames - 1)) * 100 : 0;
  $('timelineProgress').style.left = lockPct + '%';
  $('timelineProgress').style.width = Math.max(0, pct - lockPct) + '%';
  $('timelineThumb').style.left = pct + '%';
  let closest = null, best = Infinity;
  const labels = $('timelineLabels').querySelectorAll('.timeline-label');
  labels.forEach((el) => {
    const delta = Math.abs(parseFloat(el.style.left) - pct);
    if (delta < best) { best = delta; closest = el; }
  });
  labels.forEach((el) => el.classList.toggle('active', el === closest));
}

function indexFromEvent(e) {
  const rect = $('timeline').getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  return Math.round(Math.max(0, Math.min(1, x / rect.width)) * (totalFrames - 1));
}

function seek(idx) {
  idx = Math.max(0, Math.min(totalFrames - 1, idx));
  if (idx < minIndex) { promptLocked(idx); idx = minIndex; }
  if (idx === lastRendered) return;
  radar.goToFrameLayer(activeKey, idx);
  updateUI(idx);
}

$('timeline').addEventListener('mousedown', (e) => {
  if (!totalFrames) return;
  dragging = true; pauseUI(); seek(indexFromEvent(e));
});
$('timeline').addEventListener('touchstart', (e) => {
  if (!totalFrames) return;
  dragging = true; pauseUI(); seek(indexFromEvent(e));
}, { passive: true });
window.addEventListener('mousemove', (e) => { if (dragging) seek(indexFromEvent(e)); });
window.addEventListener('touchmove', (e) => { if (dragging) seek(indexFromEvent(e)); }, { passive: true });
window.addEventListener('mouseup', () => { dragging = false; lockPrompted = false; });
window.addEventListener('touchend', () => { dragging = false; lockPrompted = false; });

/* ===================== Play/Pause ===================== */
function setPausedUI(paused) {
  uiPaused = paused;
  $('playPauseBtn').textContent = paused ? 'Reprèn' : 'Pausa';
}
function pauseUI() { radar.pauseRadarAnimation(); setPausedUI(true); }

$('playPauseBtn').addEventListener('click', () => {
  if (uiPaused) { radar.resumeRadarAnimation(); setPausedUI(false); }
  else pauseUI();
});

function step(delta) {
  pauseUI();
  const s = radar.getLayerState(activeKey);
  if (!s || totalFrames === 0) return;
  const span = Math.max(1, totalFrames - minIndex);
  const idx = minIndex + ((((s.currentIndex - minIndex) + delta) % span) + span) % span;
  radar.goToFrameLayer(activeKey, idx);
  updateUI(idx);
}
$('prevBtn').addEventListener('click', () => step(-1));
$('nextBtn').addEventListener('click', () => step(1));

/* ===================== Productes ===================== */
function syncTimeline(key) {
  const st = radar.getLayerState(key);
  if (!st || !st.initialized) return false;
  totalFrames = st.totalFrames;
  timestamps = st.timestamps || [];
  intervalMin = timestamps.length >= 2 && timestamps[0] && timestamps[1]
    ? Math.max(1, Math.round((timestamps[1] - timestamps[0]) / 60000)) : 5;
  rebuildTimelineLabels();
  computeAccess();
  return true;
}

async function selectProduct(key) {
  if (!PRODUCTS[key]) return;

  // Si es tria dbz o vel, amaguem els litres
  if (litres) litres.hide();

  const seq = ++switchSeq;
  const st = radar.getLayerState(key);
  if (!st || !st.initialized) {
    console.warn('[ui] producte no inicialitzat:', key);
    return;
  }

  let ms = lastRadarMs;
  const prev = radar.getLayerState(activeKey);
  if (prev && prev.initialized && prev.currentTime) ms = prev.currentTime;

  await radar.syncToTime(key, ms);
  if (seq !== switchSeq) return;

  activeKey = key;
  for (const k of Object.keys(PRODUCTS)) {
    const s = radar.getLayerState(k);
    if (s && s.initialized) radar.setLayerVisibility(k, k === key && radarOn);
  }
  document.querySelectorAll('#flyout-productSelect .opt').forEach((o) => o.classList.toggle('selected', o.dataset.product === key));
  $('chipProduct').textContent = PRODUCTS[key].chip;
  renderLegend(key);
  syncTimeline(key);
}

document.querySelectorAll('#flyout-productSelect .opt').forEach((o) => {
  o.addEventListener('click', () => { selectProduct(o.dataset.product); closeAllFlyouts(); });
});

/* ===================== AutoReload ===================== */
function setAutoReload(on) {
  try { localStorage.setItem('radar.autoreload', on ? '1' : '0'); } catch (_) {}
  if (on) {
    if (stopAutoReload) return;
    stopAutoReload = initAutoReload({ intervalMs: 30000, watch: ['dbz', 'vel'] });
    $('chkAutoReload').checked = true;
    console.log('[autoreload] activat');
  } else {
    if (stopAutoReload) { stopAutoReload(); stopAutoReload = null; }
    $('chkAutoReload').checked = false;
    console.log('[autoreload] desactivat');
  }
}
$('chkAutoReload').addEventListener('change', (e) => setAutoReload(e.target.checked));

/* ===================== Accés per pla ===================== */
function minIndexFor(key) {
  const st = radar.getLayerState(key);
  if (!st || !st.initialized) return 0;
  const mins = ACCESS[tier].minutes;
  if (!isFinite(mins)) return 0;
  const ts = st.timestamps;
  let latest = null;
  for (let i = ts.length - 1; i >= 0; i--) { if (ts[i]) { latest = ts[i].getTime(); break; } }
  if (latest === null) return 0;
  const limit = latest - mins * 60000 - 1000;
  for (let i = 0; i < ts.length; i++) { if (ts[i] && ts[i].getTime() >= limit) return i; }
  return 0;
}

function computeAccess() {
  for (const k of Object.keys(PRODUCTS)) radar.setMinIndex(k, minIndexFor(k));
  const st = radar.getLayerState(activeKey);
  minIndex = st ? st.minIndex : 0;
  lockPct = totalFrames > 1 ? (minIndex / (totalFrames - 1)) * 100 : 0;
  const locked = $('timelineLocked'), lock = $('timelineLock');
  if (locked) locked.style.width = lockPct + '%';
  if (lock) {
    lock.style.display = lockPct > 0 ? 'block' : 'none';
    lock.style.left = (lockPct / 2) + '%';
  }
  $('timelineLabels').querySelectorAll('.timeline-label').forEach((el) => {
    el.classList.toggle('locked', parseFloat(el.style.left) < lockPct - 0.01);
  });
  lastRendered = -1;
  if (st && st.initialized) updateUI(Math.max(st.currentIndex, minIndex));
}

function requiredTierFor(idx) {
  const ts = timestamps;
  let latest = null;
  for (let i = ts.length - 1; i >= 0; i--) { if (ts[i]) { latest = ts[i].getTime(); break; } }
  const d = ts[idx];
  if (latest === null || !d) return 'free';
  const age = (latest - d.getTime()) / 60000;
  if (age <= ACCESS.anon.minutes) return 'anon';
  if (age <= ACCESS.free.minutes) return 'free';
  if (age <= ACCESS.entusiasta.minutes) return 'entusiasta';
  return 'professional';
}

function promptLocked(idx) {
  if (lockPrompted) return;
  lockPrompted = true;
  openUpsell(requiredTierFor(idx));
}

/* ===================== Upsell ===================== */
const PREUS_URL = 'https://tempestes.cat/privacitat/preus';
const DB_URL = 'https://tempestescat-default-rtdb.europe-west1.firebasedatabase.app';
const userName = (u) => (u.displayName || '').trim() || (u.email ? u.email.split('@')[0] : 'Usuari');

function openUpsell(need, custom) {
  const here = TIERS.indexOf(tier);
  const texts = {
    anon: ['Inicia sessió per veure més', 'Sense compte pots veure els últims 25 minuts. Amb un compte gratuït desbloqueges l\'hora sencera.', 'Iniciar sessió amb Google', () => loginGoogle()],
    free: ['Inicia sessió per veure 1 hora', 'Sense compte pots veure els últims 25 minuts. Amb un compte gratuït desbloqueges l\'hora sencera.', 'Iniciar sessió amb Google', () => loginGoogle()],
    entusiasta: ['Amplia fins a 3 hores', 'Aquest tram del radar és del pla Entusiasta.', 'Veure el pla Entusiasta', () => { location.href = PREUS_URL + '?pla=entusiasta'; }],
    professional: ['24 hores i arxiu', 'Aquest tram del radar i l\'arxiu històric són del pla Professional.', 'Veure el pla Professional', () => { location.href = PREUS_URL + '?pla=professional'; }],
  };
  let [title, text, cta, action] = texts[need] || texts.free;
  if (custom) { title = custom.title; text = custom.text; }
  $('upsellTitle').textContent = title;
  $('upsellText').textContent = text;
  const needIdx = TIERS.indexOf(need);
  $('upsellTiers').innerHTML = TIERS.map((k, i) => {
    const cls = ['tier-row', i <= here ? 'ok' : '', i === needIdx ? 'need' : '', i === here ? 'here' : ''].join(' ');
    return `<div class="${cls}"><b>${ACCESS[k].name}</b><span>${ACCESS[k].window}</span></div>`;
  }).join('');
  const primary = $('upsellPrimary');
  primary.textContent = cta;
  primary.onclick = action;
  $('upsell').classList.add('open');
  $('upsell').setAttribute('aria-hidden', 'false');
}

function closeUpsell() {
  $('upsell').classList.remove('open');
  $('upsell').setAttribute('aria-hidden', 'true');
}
$('upsellX').addEventListener('click', closeUpsell);
$('upsellSecondary').addEventListener('click', closeUpsell);
$('upsell').addEventListener('click', (e) => { if (e.target === $('upsell')) closeUpsell(); });

/* ===================== Firebase ===================== */
async function fetchPlan(u) {
  try {
    const token = await u.getIdToken();
    const r = await fetch(`${DB_URL}/users/${encodeURIComponent(u.uid)}/pla.json?auth=${token}`, { cache: 'no-store' });
    if (!r.ok) return 'gratuït';
    const k = String((await r.json()) || '').trim().toLowerCase().replace('gratuit', 'gratuït');
    return ['gratuït', 'entusiasta', 'professional', 'equips'].includes(k) ? k : 'gratuït';
  } catch (e) { return 'gratuït'; }
}

async function fetchIsAdmin(u) {
  if (!u || !u.email) return false;
  try {
    const token = await u.getIdToken();
    const k = u.email.toLowerCase().replace(/\./g, ',');
    const r = await fetch(`${DB_URL}/admin/${encodeURIComponent(k)}.json?auth=${token}`, { cache: 'no-store' });
    return r.ok && (await r.json()) === true;
  } catch (e) { return false; }
}

let auth = null, fb = null;

const authReady = (async () => {
  try {
    const [appMod, authMod] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js'),
    ]);
    fb = authMod;
    auth = authMod.getAuth(appMod.initializeApp({
      apiKey: "AIzaSyBGcGUk2gsoDaHkg9Yv-nqMJ5_x-QPTMS8",
      authDomain: "tempestescat.firebaseapp.com",
      projectId: "tempestescat",
      storageBucket: "tempestescat.firebasestorage.app",
      messagingSenderId: "683240351775",
      appId: "1:683240351775:web:bc65d73249537b9cc28d2a",
    }));

    authMod.onAuthStateChanged(auth, async (u) => {
      currentUser = u;
      if (!u) { tier = 'anon'; planLabel = ''; accessChanged(); return; }
      tier = 'free'; planLabel = 'Gratuït';
      accessChanged();
      const [plan, admin] = await Promise.all([fetchPlan(u), fetchIsAdmin(u)]);
      if (currentUser !== u) return;
      if (admin) { tier = 'professional'; planLabel = 'Admin'; }
      else if (plan === 'entusiasta') { tier = 'entusiasta'; planLabel = 'Entusiasta'; }
      else if (plan === 'professional' || plan === 'equips') { tier = 'professional'; planLabel = plan === 'equips' ? 'Equips' : 'Professional'; }
      else { tier = 'free'; planLabel = 'Gratuït'; }
      accessChanged();
    });
  } catch (e) { console.warn('[firebase]', e); }
})();

async function loginGoogle() {
  try {
    await authReady;
    if (!auth || !fb) return;
    await fb.signInWithPopup(auth, new fb.GoogleAuthProvider());
    closeUpsell();
    closeAllFlyouts();
  } catch (e) { console.error(e); }
}

async function logout() {
  try {
    await authReady;
    if (auth && fb) await fb.signOut(auth);
  } catch (e) { console.error(e); }
}

function humanAuthError(err) {
  const code = (err && err.code) || '';
  if (code === 'auth/invalid-email') return 'Correu no vàlid.';
  if (code === 'auth/missing-password') return 'Falta la contrasenya.';
  if (code === 'auth/weak-password') return 'La contrasenya ha de tenir com a mínim 6 caràcters.';
  if (code === 'auth/email-already-in-use') return 'Aquest correu ja té un compte.';
  if (code === 'auth/user-not-found' || code === 'auth/wrong-password' || code === 'auth/invalid-credential') return 'Correu o contrasenya incorrectes.';
  if (code === 'auth/too-many-requests') return 'Massa intents. Torna-ho a provar més tard.';
  if (code === 'auth/operation-not-allowed') return 'El mètode correu/contrasenya no està activat.';
  if (code === 'auth/unauthorized-domain') return 'Aquest domini no està autoritzat.';
  return (err && err.message) || 'Error inesperat.';
}

function updateAccountUI() {
  const userBtn = $('userBtn');
  const accountBox = $('accountBox');
  const chipPlan = $('chipPlan');
  if (chipPlan) chipPlan.textContent = `${ACCESS[tier].name} · ${ACCESS[tier].window}`;
  if (!accountBox) return;

  if (!currentUser) {
    if (userBtn) userBtn.innerHTML = `<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg><span class="label">Perfil</span>`;
    accountBox.innerHTML = `
      <div class="acc-line"><span>Historial visible</span><span class="acc-badge">${ACCESS.anon.window}</span></div>
      <div class="info-text">Inicia sessió o crea un compte per desbloquejar més historial.</div>
      <div class="acc-actions"><button class="primary" id="accGoogle">Continuar amb Google</button></div>
      <div id="authFormWrap">
        <form class="auth-form" id="authForm">
          <input type="email" name="email" placeholder="Correu electrònic" autocomplete="email" required />
          <input type="password" name="password" placeholder="Contrasenya" autocomplete="current-password" minlength="6" required />
          <div class="auth-error" id="authError"></div>
          <button class="primary" type="submit" id="authSubmit">Iniciar sessió</button>
        </form>
        <button class="auth-toggle" id="authToggle">No tinc compte · Crear-ne un</button>
      </div>`;
    $('accGoogle').addEventListener('click', loginGoogle);
    let mode = 'login';
    const form = $('authForm');
    const submitBtn = $('authSubmit');
    const toggle = $('authToggle');
    const errEl = $('authError');
    toggle.addEventListener('click', () => {
      mode = mode === 'login' ? 'register' : 'login';
      submitBtn.textContent = mode === 'register' ? 'Crear compte' : 'Iniciar sessió';
      toggle.textContent = mode === 'register' ? 'Ja tinc compte · Iniciar sessió' : 'No tinc compte · Crear-ne un';
      form.querySelector('input[name="password"]').setAttribute('autocomplete', mode === 'register' ? 'new-password' : 'current-password');
      errEl.textContent = '';
    });
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.textContent = '';
      const email = (form.querySelector('input[name="email"]').value || '').trim();
      const password = (form.querySelector('input[name="password"]').value || '');
      try {
        submitBtn.disabled = true; submitBtn.textContent = 'Espera…';
        await authReady;
        if (!auth || !fb) throw new Error('Firebase no disponible');
        if (mode === 'register') await fb.createUserWithEmailAndPassword(auth, email, password);
        else await fb.signInWithEmailAndPassword(auth, email, password);
        closeAllFlyouts();
      } catch (err) {
        errEl.textContent = humanAuthError(err);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = mode === 'register' ? 'Crear compte' : 'Iniciar sessió';
      }
    });
    return;
  }

  const nom = userName(currentUser);
  const ini = escapeHtml(nom[0] ? nom[0].toUpperCase() : '?');
  const avatar = currentUser.photoURL
    ? `<img src="${escapeHtml(currentUser.photoURL)}" alt="" referrerpolicy="no-referrer">` : ini;
  if (userBtn) {
    userBtn.innerHTML = currentUser.photoURL
      ? `<img src="${escapeHtml(currentUser.photoURL)}" alt="" referrerpolicy="no-referrer">`
      : `<span class="ini">${ini}</span><span class="label">Perfil</span>`;
  }
  accountBox.innerHTML = `
    <div class="acc-who">
      <div class="acc-av">${avatar}</div>
      <div style="min-width:0"><div class="acc-name">${escapeHtml(nom)}</div><div class="acc-mail">${escapeHtml(currentUser.email || '')}</div></div>
    </div>
    <div class="acc-line"><span>Pla</span><span class="acc-badge">${escapeHtml(planLabel || ACCESS[tier].name)}</span></div>
    <div class="acc-line"><span>Historial visible</span><span>${ACCESS[tier].window}</span></div>
    <div class="acc-actions">
      ${tier !== 'professional' ? `<a class="primary" href="${PREUS_URL}" target="_blank" rel="noopener">Veure plans / Comprar</a>` : `<a class="primary" href="${PREUS_URL}" target="_blank" rel="noopener">Gestionar pla</a>`}
      <button id="accLogout">Tancar sessió</button>
    </div>`;
  $('accLogout').addEventListener('click', logout);
}

function accessChanged() {
  computeAccess();
  updateAccountUI();
}

/* ===================== Map load ===================== */
map.once('style.load', async () => {
  setLoad(35, 'Carregant el radar…');
  hideBaseLabels();
  alertes.start().catch(() => {});
  try {
    await radar.initRadar(map);
  } catch (e) {
    console.error('[radar]', e);
    setStatus('No s\'ha pogut carregar el radar.');
    setLoad(100, 'Error');
    setTimeout(hideLoader, 800);
    return;
  }

  $('chkRelleu').checked = false;
  radar.setReliefVisibility(false);

  const available = Object.keys(PRODUCTS).filter((k) => {
    const s = radar.getLayerState(k);
    return s && s.initialized && s.totalFrames > 0;
  });
  document.querySelectorAll('#flyout-productSelect .opt').forEach((o) => {
    o.disabled = !available.includes(o.dataset.product);
  });

  if (available.length === 0) {
    setStatus('No hi ha cap imatge disponible.');
    setLoad(100, 'Sense dades');
    setTimeout(hideLoader, 800);
    return;
  }

  await selectProduct(available.includes('dbz') ? 'dbz' : available[0]);
  radar.startAllAnimations();

  // Inicialitzem Litres
  litres = initLitres({
    map,
    onActivate: () => {
      radar.setLayerVisibility('dbz', false);
      radar.setLayerVisibility('vel', false);
    },
    onDeactivate: () => {
      radar.setLayerVisibility('dbz', activeKey === 'dbz' && radarOn);
      radar.setLayerVisibility('vel', activeKey === 'vel' && radarOn);
    }
  });

  let arStored = null;
  try { arStored = localStorage.getItem('radar.autoreload'); } catch (_) {}
  if (arStored !== '0') {
    setAutoReload(true);
  } else {
    $('chkAutoReload').checked = false;
  }

  setLoad(100, 'A punt!');
  hideLoader();
  appReady = true;
});
</script>
