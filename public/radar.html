<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width:100%; height:100%; overflow:hidden; overscroll-behavior:none; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:#0a0c14; color:#eef; }
  #map { position:absolute; inset:0; }

  :root {
    --panel-bg: rgba(10, 12, 20, 0.86);
    --panel-border: rgba(120, 140, 180, 0.22);
    --radius: 14px;
    --blur: blur(14px);
    --accent: #5a9dff;
    --accent-dark: #3559a0;
    --text: #eef;
    --text-2: #8fa5cb;
    --text-3: #7f94b4;
    --btn: rgba(30, 40, 62, 0.85);
    --btn-hover: rgba(45, 60, 90, 0.95);
    --btn-border: rgba(120, 140, 180, 0.28);
    --btn-border-hover: rgba(140, 170, 220, 0.55);
    --shadow: 0 10px 40px rgba(0, 0, 0, 0.55);
    --side-w: 64px;
    --player-h: 108px;
    --track-h: 8px;
    --thumb: 20px;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ===================== BANDAS LATERALES ===================== */
  .side-rail {
    position:fixed; top:0; bottom:0; z-index:30; width:var(--side-w);
    display:flex; flex-direction:column; align-items:center; gap:4px; padding:12px 6px;
    background:var(--panel-bg); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  }
  .side-rail.left { left:0; border-right:1px solid var(--panel-border); }
  .side-rail.right { right:0; border-left:1px solid var(--panel-border); }

  .rail-btn {
    position:relative; width:50px; height:50px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    background:transparent; border:none; border-radius:10px;
    color:var(--text-3); cursor:pointer; transition:background .15s, color .15s;
  }
  .rail-btn:hover { background:var(--btn-hover); color:var(--text); }
  .rail-btn.active { background:rgba(90,157,255,.15); color:var(--accent); }
  .rail-btn svg { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .rail-btn .label { font-size:9px; font-weight:600; letter-spacing:.3px; text-transform:uppercase; }
  .rail-btn.disabled { opacity:.4; cursor:not-allowed; }
  .rail-btn.disabled:hover { background:transparent; color:var(--text-3); }
  .rail-sep { width:28px; height:1px; background:var(--panel-border); margin:4px 0; }

  #userBtn { overflow:hidden; }
  #userBtn img { width:100%; height:100%; object-fit:cover; border-radius:10px; }
  #userBtn .ini { font-weight:700; font-size:15px; color:#fff; }

  /* ===================== FLYOUTS ===================== */
  .flyout {
    position:fixed; z-index:40; min-width:260px; max-width:340px; padding:10px;
    background:var(--panel-bg); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
    border:1px solid var(--panel-border); border-radius:var(--radius);
    box-shadow:var(--shadow); display:none; max-height:80vh; overflow-y:auto;
  }
  .flyout.open { display:block; animation:flyIn .12s ease-out; }
  @keyframes flyIn { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:none} }
  .flyout-title { font-size:11px; font-weight:700; color:var(--text-2); text-transform:uppercase; letter-spacing:.6px; padding:4px 8px 8px; border-bottom:1px solid var(--panel-border); margin-bottom:6px; }

  .opt {
    display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%;
    padding:9px 10px; background:transparent; border:none; border-radius:8px;
    color:var(--text); font:inherit; font-size:13px; text-align:left; cursor:pointer; transition:background .12s;
  }
  .opt:hover { background:var(--btn-hover); }
  .opt.selected { background:rgba(90,157,255,.18); }
  .opt .opt-main { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .opt .opt-name { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .opt .opt-sub { font-size:11px; color:var(--text-3); }
  .opt .check { width:14px; height:14px; stroke:var(--accent); fill:none; stroke-width:2.5; opacity:0; flex-shrink:0; }
  .opt.selected .check { opacity:1; }
  .opt:disabled { opacity:.4; cursor:not-allowed; }

  .check { display:flex; align-items:center; gap:10px; padding:8px 0; font-size:13px; cursor:pointer; }
  .check input { width:18px; height:18px; accent-color:var(--accent); cursor:pointer; flex-shrink:0; }
  .check.disabled { opacity:.45; cursor:not-allowed; }
  .check.disabled input { cursor:not-allowed; }
  .check .tag { margin-left:auto; padding:1px 7px; font-size:10px; font-weight:700; border-radius:999px; }
  .check .tag.pro { background:var(--accent-dark); border:1px solid var(--accent); color:#fff; }
  .check .tag.free { background:rgba(90,157,255,.15); border:1px solid rgba(90,157,255,.5); color:var(--accent); }
  .check .tag.soon { background:rgba(120,140,180,.15); border:1px solid rgba(120,140,180,.4); color:var(--text-3); }

  .info-text { font-size:12px; line-height:1.5; color:var(--text-3); }

  /* Account */
  .account-box { display:grid; gap:10px; padding:12px; background:rgba(30,40,62,.6); border:1px solid var(--btn-border); border-radius:10px; }
  .acc-who { display:flex; align-items:center; gap:10px; min-width:0; }
  .acc-av { width:34px; height:34px; border-radius:50%; overflow:hidden; background:var(--accent-dark); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; flex-shrink:0; }
  .acc-av img { width:100%; height:100%; object-fit:cover; }
  .acc-name { font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .acc-mail { font-size:11px; color:var(--text-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .acc-line { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:12px; color:var(--text-2); }
  .acc-badge { padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700; color:#fff; background:var(--accent-dark); border:1px solid var(--accent); }
  .acc-actions { display:flex; gap:8px; flex-wrap:wrap; }
  .acc-actions button, .acc-actions a {
    flex:1; min-height:36px; padding:8px 12px; font-size:12px; text-align:center;
    text-decoration:none; display:inline-flex; align-items:center; justify-content:center;
    background:var(--btn); color:var(--text); border:1px solid var(--btn-border);
    border-radius:8px; font-weight:500; cursor:pointer;
  }
  .acc-actions .primary { background:var(--accent-dark); border-color:var(--accent); color:#fff; }

  /* Auth forms */
  .auth-form { display:grid; gap:8px; margin-top:6px; }
  .auth-form input {
    width:100%; min-height:36px; padding:8px 10px;
    background:rgba(24,34,46,.9); color:var(--text);
    border:1px solid var(--btn-border); border-radius:8px;
    font:inherit; font-size:13px; outline:none;
  }
  .auth-form input:focus { border-color:var(--accent); }
  .auth-form .primary {
    background:var(--accent-dark); border:1px solid var(--accent); color:#fff; font-weight:600;
    min-height:38px; padding:8px 12px; border-radius:8px; cursor:pointer;
    font:inherit; font-size:13px;
  }
  .auth-toggle {
    text-align:center; font-size:12px; color:var(--text-3);
    padding:8px 0 2px; cursor:pointer; background:transparent; border:none;
    text-decoration:underline; width:100%;
  }
  .auth-error { color:#f87171; font-size:12px; padding:2px 4px; min-height:0; }

  /* ===================== TOPBAR ===================== */
  .topbar {
    position:absolute; z-index:25;
    top:max(12px, env(safe-area-inset-top));
    left:calc(var(--side-w) + max(12px, env(safe-area-inset-left)));
    right:calc(var(--side-w) + max(12px, env(safe-area-inset-right)));
    display:flex; align-items:center; gap:8px; pointer-events:none;
  }
  .topbar > * { pointer-events:auto; }
  .brand {
    display:flex; align-items:center; gap:8px; padding:8px 14px;
    background:var(--panel-bg); border:1px solid var(--panel-border); border-radius:12px;
    backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur); font-weight:700; font-size:14px;
    box-shadow:var(--shadow);
  }
  .brand span { color:#6aa5ff; }
  .topbar .spacer { flex:1; }
  .chip {
    display:flex; align-items:center; gap:6px; padding:8px 12px;
    background:var(--panel-bg); border:1px solid var(--panel-border); border-radius:12px;
    backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur); font-size:12px; font-weight:600;
    box-shadow:var(--shadow);
  }
  .chip .dot { width:7px; height:7px; border-radius:50%; background:#22c55e; box-shadow:0 0 8px #22c55e; }
  .chip.plan { color:#eaf2ff; border-color:var(--accent); background:rgba(53,89,160,.6); }

  /* ===================== LEYENDA ===================== */
  #legend {
    position:absolute; z-index:20;
    left:calc(var(--side-w) + max(12px, env(safe-area-inset-left)));
    bottom:calc(var(--player-h) + max(12px, env(safe-area-inset-bottom)) + 8px);
    padding:10px 12px;
    background:var(--panel-bg); border:1px solid var(--panel-border); border-radius:var(--radius);
    backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur); box-shadow:var(--shadow);
    transition:opacity .2s, transform .2s;
  }
  #legend.hidden { opacity:0; pointer-events:none; transform:translateX(-20px); }
  #legend h3 { margin-bottom:8px; font-size:12px; font-weight:700; color:var(--text-2); }
  .legend-body { display:flex; gap:8px; height:170px; }
  .legend-bar { width:12px; border-radius:6px; border:1px solid rgba(255,255,255,.12); }
  .legend-ticks { position:relative; width:30px; }
  .legend-tick { position:absolute; left:0; transform:translateY(50%); font-size:11px; color:#cfdcf0; font-variant-numeric:tabular-nums; }

  /* ===================== BOTTOM BAR ===================== */
  #bottomBar {
    position:absolute; z-index:15; pointer-events:none;
    bottom:max(12px, env(safe-area-inset-bottom));
    left:calc(var(--side-w) + max(12px, env(safe-area-inset-left)));
    right:calc(var(--side-w) + max(12px, env(safe-area-inset-right)));
  }
  .player {
    pointer-events:auto; display:flex; flex-direction:column; gap:6px;
    padding:10px 14px 8px;
    background:var(--panel-bg); border:1px solid var(--panel-border); border-radius:var(--radius);
    backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur); box-shadow:var(--shadow);
  }
  .player-top { display:flex; align-items:center; gap:12px; }
  .player-actions { display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .player-actions button { min-height:36px; padding:0; display:flex; align-items:center; justify-content:center; }
  .btn-play { min-width:78px; padding:0 12px !important; font-weight:600; }
  .btn-step { width:36px; height:36px; }
  .btn-step svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }

  button {
    min-height:38px; padding:8px 14px;
    background:var(--btn); color:var(--text);
    border:1px solid var(--btn-border); border-radius:8px;
    font:inherit; font-size:13px; font-weight:500; cursor:pointer;
    transition:background .15s, border-color .15s;
  }
  button:hover:not(:disabled) { background:var(--btn-hover); border-color:var(--btn-border-hover); }
  button:disabled { opacity:.3; cursor:not-allowed; }
  button.active { background:var(--accent-dark); border-color:var(--accent); color:#fff; }

  .player-times { margin-left:auto; display:flex; align-items:baseline; gap:10px; font-variant-numeric:tabular-nums; }
  .time-current { font-size:18px; font-weight:700; color:#fff; line-height:1; }
  .time-date { font-size:12px; color:var(--text-2); }

  .timeline { position:relative; width:100%; height:38px; cursor:pointer; touch-action:none; user-select:none; }
  .timeline-track { position:absolute; left:0; right:0; top:12px; height:var(--track-h); border-radius:4px; overflow:hidden; background:rgba(30,40,62,.85); }
  .timeline-progress { position:absolute; left:0; top:0; bottom:0; width:0; background:linear-gradient(90deg,#3a6ac0,#5a9dff); pointer-events:none; }
  .timeline-thumb { position:absolute; top:16px; left:0; width:var(--thumb); height:var(--thumb); transform:translate(-50%,-50%); border-radius:50%; background:#fff; border:3px solid var(--accent); box-shadow:0 2px 10px rgba(90,157,255,.6); pointer-events:none; }
  .timeline-labels { position:absolute; left:0; right:0; bottom:0; height:14px; pointer-events:none; }
  .timeline-label { position:absolute; transform:translateX(-50%); white-space:nowrap; font-size:10px; font-weight:600; color:var(--text-2); font-variant-numeric:tabular-nums; }
  .timeline-label.active { color:var(--accent); font-weight:700; }
  .timeline-label.edge-l { transform:none; }
  .timeline-label.edge-r { transform:translateX(-100%); }
  .timeline-label.locked { opacity:.35; }

  .timeline-locked {
    position:absolute; left:0; top:0; bottom:0; width:0; pointer-events:none;
    background:repeating-linear-gradient(135deg, rgba(150,150,150,.30) 0 4px, rgba(150,150,150,.12) 4px 8px);
    border-right:2px solid rgba(190,190,190,.6);
  }
  .timeline-lock { position:absolute; top:0; left:0; display:none; transform:translateX(-50%); color:var(--text-3); pointer-events:none; }
  .timeline-lock svg { width:11px; height:11px; stroke:currentColor; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; display:block; }

  /* ===================== UPSELL ===================== */
  .upsell { position:fixed; inset:0; z-index:200; display:none; align-items:center; justify-content:center; padding:16px; background:rgba(0,0,0,.6); backdrop-filter:blur(4px); }
  .upsell.open { display:flex; }
  .upsell-card { position:relative; width:100%; max-width:400px; padding:26px 22px 20px; background:#12151f; border:1px solid var(--panel-border); border-radius:16px; box-shadow:var(--shadow); text-align:center; }
  .upsell-x { position:absolute; top:10px; right:10px; width:32px; height:32px; min-height:0; padding:0; background:transparent; border:none; font-size:22px; color:var(--text-2); cursor:pointer; }
  .upsell-ico { width:46px; height:46px; margin:0 auto 12px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--accent-dark); color:#fff; }
  .upsell-ico svg { width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .upsell-card h3 { font-size:18px; margin-bottom:6px; }
  .upsell-card p { font-size:13px; line-height:1.55; color:var(--text-2); margin-bottom:14px; }
  .upsell-tiers { display:grid; gap:6px; margin-bottom:16px; text-align:left; }
  .tier-row { display:flex; align-items:center; gap:10px; padding:8px 12px; font-size:12.5px; border:1px solid var(--btn-border); border-radius:9px; color:var(--text-2); }
  .tier-row b { color:var(--text); font-weight:600; margin-right:auto; }
  .tier-row.ok { color:var(--text); }
  .tier-row.need { border-color:var(--accent); background:rgba(90,157,255,.12); color:var(--text); }
  .tier-row.here b::after { content:" (tu)"; font-weight:400; color:var(--text-3); }
  .upsell-actions { display:grid; gap:8px; }
  .upsell-actions .primary { background:var(--accent-dark); border-color:var(--accent); color:#fff; font-weight:600; min-height:42px; }

  /* ===================== LOADER ===================== */
  #loader {
    position:fixed; inset:0; z-index:500;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
    background:radial-gradient(ellipse at center, #10141f 0%, #06080d 100%);
    transition:opacity .3s ease;
  }
  #loader.hide { opacity:0; pointer-events:none; }
  .loader-logo { display:flex; align-items:center; gap:12px; }
  .loader-logo img { width:46px; height:46px; object-fit:contain; }
  .loader-brand { font-size:26px; font-weight:800; color:#fff; }
  .loader-brand span { color:#6aa5ff; }
  .loader-bar { position:relative; width:min(340px,72vw); height:6px; border-radius:999px; background:rgba(120,140,180,.16); overflow:hidden; }
  .loader-bar-fill { position:absolute; left:0; top:0; bottom:0; width:0; border-radius:999px; background:linear-gradient(90deg,#3a6ac0,#5a9dff); transition:width .25s ease; }
  .loader-text { font-size:12.5px; color:#8fa5cb; }

  /* MapLibre */
  .maplibregl-ctrl-top-right { top:calc(max(12px, env(safe-area-inset-top)) + 58px); right:calc(var(--side-w) + max(12px, env(safe-area-inset-right))) !important; }
  .maplibregl-ctrl-bottom-left, .maplibregl-ctrl-bottom-right { bottom:calc(var(--player-h) + max(12px, env(safe-area-inset-bottom))); }
  .maplibregl-ctrl-group { background:var(--panel-bg) !important; border:1px solid var(--panel-border) !important; border-radius:10px !important; box-shadow:var(--shadow) !important; }
  .maplibregl-ctrl-group button { background:transparent !important; }
  .maplibregl-ctrl-attrib { background:rgba(10,12,20,.7) !important; color:#9cb4d8 !important; font-size:10px !important; }

  @media (max-width: 768px) {
    :root { --side-w:56px; --player-h:98px; --track-h:6px; --thumb:18px; }
    .brand { display:none; }
    .chip { padding:6px 9px; font-size:11px; }
    .flyout { min-width:220px; max-width:calc(100vw - 80px); }
  }
</style>
</head>
<body>

<div id="map" role="application" aria-label="Mapa de radar meteorològic"></div>

<div id="loader" aria-hidden="true">
  <div class="loader-logo">
    <img src="/img/Tempestes_cat.ico" alt="" />
    <div class="loader-brand">Tempestes<span>.cat</span></div>
  </div>
  <div class="loader-bar"><div id="loaderFill" class="loader-bar-fill"></div></div>
  <div id="loaderText" class="loader-text">Preparant el radar…</div>
</div>

<!-- ===================== BANDA IZQUIERDA ===================== -->
<aside class="side-rail left" aria-label="Eines esquerra">
  <button class="rail-btn" data-flyout="productSelect" title="Producte">
    <svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 4 5-8 4 5"/></svg>
    <span class="label">Producte</span>
  </button>
  <button class="rail-btn" data-flyout="layerSelect" title="Capes">
    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
    <span class="label">Capes</span>
  </button>
  <div class="rail-sep"></div>
  <button class="rail-btn" data-flyout="mapSelect" title="Mapa base">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
    <span class="label">Mapa</span>
  </button>
</aside>

<!-- ===================== BANDA DERECHA ===================== -->
<aside class="side-rail right" aria-label="Eines dreta">
  <button class="rail-btn disabled" id="avisBtn" title="Properament">
    <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
    <span class="label">Avisos</span>
  </button>
  <button class="rail-btn" title="Estacions" id="estacionsBtn">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>
    <span class="label">Estacions</span>
  </button>
  <div class="rail-sep"></div>
  <button id="userBtn" class="rail-btn" title="El meu perfil" aria-label="El meu perfil">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    <span class="label">Perfil</span>

<script type="module">
import radarDefault, * as radarNs from '/js/radar.js';
const radar = { ...radarDefault, ...radarNs };

if (!radar.pauseRadarAnimation && radar.stopAllAnimations) radar.pauseRadarAnimation = radar.stopAllAnimations;
if (!radar.resumeRadarAnimation && radar.startAllAnimations) radar.resumeRadarAnimation = radar.startAllAnimations;

import { initValor } from '/dades/valor.js';
import { SCALES } from '/dades/escales.js';
import { initAutoReload } from '/dades/autoreload.js';
import { initEstacions } from '/js/estacions.js';
import { initAlertes } from '/js/alertes.js';

/* ===================== Helpers ===================== */
const $ = (id) => document.getElementById(id);
const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const setStatus = (t) => { const el = $('statusText'); if (el) el.textContent = t || ''; };

/* ===================== Loader ===================== */
const loader = $('loader'), loaderFill = $('loaderFill'), loaderText = $('loaderText');
function setLoad(pct, text) {
  if (loaderFill) loaderFill.style.width = Math.max(0, Math.min(100, pct)) + '%';
  if (text && loaderText) loaderText.textContent = text;
}
function hideLoader() {
  if (!loader) return;
  loader.classList.add('hide');
  setTimeout(() => loader.remove(), 400);
}
setLoad(10, 'Preparant el mapa…');

/* ===================== Config ===================== */
const MAP_CENTER = [1.5, 41.7];
const MAP_ZOOM = 6.4;
const BASEMAPS = {
  clar: 'https://tiles.openfreemap.org/styles/positron',
  fosc: 'https://tiles.openfreemap.org/styles/dark',
};

// Només dBZ i Doppler (VRADH)
const PRODUCTS = {
  dbz: { label: 'Reflectivitat (dBZ)', scale: SCALES.dbz, chip: 'dBZ' },
  vel: { label: 'Velocitat radial (m/s)', scale: SCALES.vel, chip: 'm/s' },
};

/* ===================== Estat ===================== */
let currentTheme = 'fosc';
try { currentTheme = localStorage.getItem('radar.theme') === 'clar' ? 'clar' : 'fosc'; } catch (e) {}

let uiPaused = false;
let radarOn = true;
let totalFrames = 0;
let activeKey = 'dbz';
let timestamps = [];
let intervalMin = 5;
let lastRendered = -1;
let dragging = false;
let minIndex = 0;
let lockPct = 0;
let lockPrompted = false;
let appReady = false;
let switchSeq = 0;
let lastRadarMs = null;

const TIERS = ['anon', 'free', 'entusiasta', 'professional'];
const ACCESS = {
  anon:         { minutes: 25,       name: 'Sense sessió', window: '25 minuts' },
  free:         { minutes: 60,       name: 'Compte gratuït', window: '1 hora' },
  entusiasta:   { minutes: 180,      name: 'Entusiasta', window: '3 hores' },
  professional: { minutes: Infinity, name: 'Professional', window: '24 hores i arxiu' },
};
let tier = 'anon';
let planLabel = '';
let currentUser = null;

let stopAutoReload = null;

/* ===================== Mapa ===================== */
const map = new maplibregl.Map({
  container: 'map',
  style: BASEMAPS[currentTheme],
  center: MAP_CENTER,
  zoom: MAP_ZOOM,
  pitch: 0,
  bearing: 0,
  attributionControl: false,
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: false }), 'top-right');
map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-right');

function hideBaseLabels() {
  const style = map.getStyle();
  if (!style) return;
  for (const l of style.layers) {
    if (l.type === 'symbol') {
      try { map.setLayoutProperty(l.id, 'visibility', 'none'); } catch (e) {}
    }
  }
}

/* ===================== Estacions & alertes ===================== */
const estacions = initEstacions({ map, visible: false });
const alertes = initAlertes({ map, visible: true });

/* ===================== FLYOUTS ===================== */
const UI = { open: null };
function closeAllFlyouts() {
  document.querySelectorAll('.flyout.open').forEach((f) => f.classList.remove('open'));
  document.querySelectorAll('.rail-btn.active').forEach((b) => b.classList.remove('active'));
  UI.open = null;
}
function positionFlyout(flyout, anchorBtn) {
  const rect = anchorBtn.getBoundingClientRect();
  const isRight = anchorBtn.closest('.side-rail.right');
  flyout.style.top = Math.max(12, rect.top) + 'px';
  flyout.style.left = ''; flyout.style.right = '';
  if (isRight) flyout.style.right = (window.innerWidth - rect.left + 8) + 'px';
  else flyout.style.left = (rect.right + 8) + 'px';
  requestAnimationFrame(() => {
    const fh = flyout.offsetHeight;
    if (rect.top + fh > window.innerHeight - 12) {
      flyout.style.top = Math.max(12, window.innerHeight - fh - 12) + 'px';
    }
  });
}
function openFlyout(id, btn) {
  const flyout = document.getElementById('flyout-' + id);
  if (!flyout || !btn) return;
  closeAllFlyouts();
  flyout.classList.add('open');
  positionFlyout(flyout, btn);
  btn.classList.add('active');
  UI.open = id;
}
function bindFlyoutTriggers() {
  document.querySelectorAll('.rail-btn[data-flyout]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (UI.open === btn.dataset.flyout) closeAllFlyouts();
      else openFlyout(btn.dataset.flyout, btn);
    });
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.flyout') && !e.target.closest('.rail-btn')) closeAllFlyouts();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeAllFlyouts(); closeUpsell(); } });
  window.addEventListener('resize', () => {
    if (!UI.open) return;
    const btn = document.querySelector(`.rail-btn[data-flyout="${UI.open}"]`);
    const flyout = document.getElementById('flyout-' + UI.open);
    if (btn && flyout) positionFlyout(flyout, btn);
  });
}

/* ===================== Leyenda ===================== */
function legendPct(p, v) {
  if (p.log) return ((Math.log10(v) - Math.log10(p.min)) / (Math.log10(p.max) - Math.log10(p.min))) * 100;
  return ((v - p.min) / (p.max - p.min)) * 100;
}
function paintLegend(p, title) {
  $('legendTitle').textContent = title;
  const stops = p.stops.map(([v, c]) => `rgb(${c[0]},${c[1]},${c[2]}) ${legendPct(p, v).toFixed(1)}%`).join(', ');
  $('legendBar').style.background = `linear-gradient(to top, ${stops})`;
  $('legendTicks').innerHTML = p.ticks.map((v) => `<span class="legend-tick" style="bottom:${legendPct(p, v).toFixed(1)}%">${v}</span>`).join('');
}
const renderLegend = (key) => paintLegend(PRODUCTS[key].scale, PRODUCTS[key].scale.title);

/* ===================== Tema ===================== */
function applyTheme(theme) {
  if (theme === currentTheme) return;
  currentTheme = theme;
  try { localStorage.setItem('radar.theme', theme); } catch (e) {}
  document.querySelectorAll('#flyout-mapSelect .opt').forEach((o) => o.classList.toggle('selected', o.dataset.theme === theme));
  radar.setBaseTheme(theme);
  map.setStyle(BASEMAPS[theme], { diff: false });
  map.once('style.load', async () => {
    hideBaseLabels();
    await radar.reapplyLayers();
    await estacions.start().catch(() => {});
    await alertes.start().catch(() => {});
  });
}
document.querySelectorAll('#flyout-mapSelect .opt').forEach((o) => {
  o.addEventListener('click', () => { applyTheme(o.dataset.theme); closeAllFlyouts(); });
});

/* ===================== Timeline ===================== */
const hourFmt = new Intl.DateTimeFormat('ca-ES', { timeZone: 'Europe/Madrid', hour: '2-digit', minute: '2-digit' });
const dayFmt = new Intl.DateTimeFormat('ca-ES', { timeZone: 'Europe/Madrid', day: '2-digit', month: 'short', year: 'numeric' });
const hourOnlyFmt = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Madrid', hour: '2-digit', hour12: false });
const minuteOnlyFmt = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Madrid', minute: '2-digit' });

function rebuildTimelineLabels() {
  const tl = $('timelineLabels');
  if (!tl) return;
  tl.innerHTML = '';
  if (totalFrames === 0) return;
  const totalH = (totalFrames * intervalMin) / 60;
  const stepH = totalH <= 4 ? 1 : totalH <= 12 ? 2 : totalH <= 24 ? 3 : totalH <= 48 ? 6 : 12;
  for (let i = 0; i < totalFrames; i++) {
    const d = timestamps[i];
    if (!d) continue;
    const h = Number(hourOnlyFmt.format(d)) % 24;
    const m = Number(minuteOnlyFmt.format(d));
    if (m === 0 && h % stepH === 0) {
      const el = document.createElement('div');
      el.className = 'timeline-label';
      el.style.left = (totalFrames > 1 ? (i / (totalFrames - 1)) * 100 : 0) + '%';
      el.textContent = String(h).padStart(2, '0') + 'h';
      tl.appendChild(el);
    }
  }
}

function updateUI(index) {
  if (index === lastRendered) return;
  lastRendered = index;
  const d = timestamps[index];
  $('timeCurrent').textContent = d ? hourFmt.format(d) : '—';
  $('timeDate').textContent = d ? dayFmt.format(d) : '—';
  const pct = totalFrames > 1 ? (index / (totalFrames - 1)) * 100 : 0;
  $('timelineProgress').style.left = lockPct + '%';
  $('timelineProgress').style.width = Math.max(0, pct - lockPct) + '%';
  $('timelineThumb').style.left = pct + '%';
  let closest = null, best = Infinity;
  const labels = $('timelineLabels').querySelectorAll('.timeline-label');
  labels.forEach((el) => {
    const delta = Math.abs(parseFloat(el.style.left) - pct);
    if (delta < best) { best = delta; closest = el; }
  });
  labels.forEach((el) => el.classList.toggle('active', el === closest));
}

function indexFromEvent(e) {
  const rect = $('timeline').getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  return Math.round(Math.max(0, Math.min(1, x / rect.width)) * (totalFrames - 1));
}

function seek(idx) {
  idx = Math.max(0, Math.min(totalFrames - 1, idx));
  if (idx < minIndex) { promptLocked(idx); idx = minIndex; }
  if (idx === lastRendered) return;
  radar.goToFrameLayer(activeKey, idx);
  updateUI(idx);
}

$('timeline').addEventListener('mousedown', (e) => {
  if (!totalFrames) return;
  dragging = true; pauseUI(); seek(indexFromEvent(e));
});
$('timeline').addEventListener('touchstart', (e) => {
  if (!totalFrames) return;
  dragging = true; pauseUI(); seek(indexFromEvent(e));
}, { passive: true });
window.addEventListener('mousemove', (e) => { if (dragging) seek(indexFromEvent(e)); });
window.addEventListener('touchmove', (e) => { if (dragging) seek(indexFromEvent(e)); }, { passive: true });
window.addEventListener('mouseup', () => { dragging = false; lockPrompted = false; });
window.addEventListener('touchend', () => { dragging = false; lockPrompted = false; });

/* ===================== Play/Pause ===================== */
function setPausedUI(paused) {
  uiPaused = paused;
  $('playPauseBtn').textContent = paused ? 'Reprèn' : 'Pausa';
}
function pauseUI() { radar.pauseRadarAnimation(); setPausedUI(true); }

$('playPauseBtn').addEventListener('click', () => {
  if (uiPaused) { radar.resumeRadarAnimation(); setPausedUI(false); }
  else pauseUI();
});

function step(delta) {
  pauseUI();
  const s = radar.getLayerState(activeKey);
  if (!s || totalFrames === 0) return;
  const span = Math.max(1, totalFrames - minIndex);
  const idx = minIndex + ((((s.currentIndex - minIndex) + delta) % span) + span) % span;
  radar.goToFrameLayer(activeKey, idx);
  updateUI(idx);
}
$('prevBtn').addEventListener('click', () => step(-1));
$('nextBtn').addEventListener('click', () => step(1));

/* ===================== Productes ===================== */
function syncTimeline(key) {
  const st = radar.getLayerState(key);
  if (!st || !st.initialized) return false;
  totalFrames = st.totalFrames;
  timestamps = st.timestamps || [];
  intervalMin = timestamps.length >= 2 && timestamps[0] && timestamps[1]
    ? Math.max(1, Math.round((timestamps[1] - timestamps[0]) / 60000)) : 5;
  rebuildTimelineLabels();
  computeAccess();
  return true;
}

async function selectProduct(key) {
  if (!PRODUCTS[key]) return;
  const seq = ++switchSeq;
  const st = radar.getLayerState(key);
  if (!st || !st.initialized) {
    console.warn('[ui] producte no inicialitzat:', key);
    return;
  }

  let ms = lastRadarMs;
  const prev = radar.getLayerState(activeKey);
  if (prev && prev.initialized && prev.currentTime) ms = prev.currentTime;

  await radar.syncToTime(key, ms);
  if (seq !== switchSeq) return;

  activeKey = key;
  for (const k of Object.keys(PRODUCTS)) {
    const s = radar.getLayerState(k);
    if (s && s.initialized) radar.setLayerVisibility(k, k === key && radarOn);
  }
  document.querySelectorAll('#flyout-productSelect .opt').forEach((o) => o.classList.toggle('selected', o.dataset.product === key));
  $('chipProduct').textContent = PRODUCTS[key].chip;
  renderLegend(key);
  syncTimeline(key);
}

document.querySelectorAll('#flyout-productSelect .opt').forEach((o) => {
  o.addEventListener('click', () => { selectProduct(o.dataset.product); closeAllFlyouts(); });
});

/* ===================== Altres capes ===================== */
$('chkRadar').addEventListener('change', (e) => {
  radarOn = e.target.checked;
  radar.setLayerVisibility(activeKey, radarOn);
});
$('chkRelleu').addEventListener('change', (e) => radar.setReliefVisibility(e.target.checked));
$('chkComarques').addEventListener('change', (e) => radar.setComarquesVisibility(e.target.checked));
$('chkMunicipis').addEventListener('change', (e) => radar.setMunicipisVisibility(e.target.checked));
$('chkCiutats').addEventListener('change', (e) => radar.setCiutatsVisibility(e.target.checked));
$('chkEstacions').addEventListener('change', (e) => estacions.setVisible(e.target.checked));
$('chkAlertes').addEventListener('change', (e) => alertes.setVisible(e.target.checked));
$('densitySelect').addEventListener('change', (e) => radar.setDensity(e.target.value));
$('densitySelect').value = radar.getDensity();

// Llamps i Avisos de pluja → "Properament": no enganxem cap listener actiu
// (els checkboxes ja venen amb `disabled` al HTML)

const valor = initValor({
  map,
  getLayerState: radar.getLayerState,
  getKey: () => activeKey,
  isRadarVisible: () => radarOn,
});
$('chkValor').addEventListener('change', (e) => valor.setEnabled(e.target.checked));

/* ===================== AutoReload (activat per defecte) ===================== */
function setAutoReload(on) {
  try { localStorage.setItem('radar.autoreload', on ? '1' : '0'); } catch (_) {}
  if (on) {
    if (stopAutoReload) return;
    stopAutoReload = initAutoReload({ intervalMs: 30000, watch: ['dbz', 'vel'] });
    $('chkAutoReload').checked = true;
    console.log('[autoreload] activat');
  } else {
    if (stopAutoReload) { stopAutoReload(); stopAutoReload = null; }
    $('chkAutoReload').checked = false;
    console.log('[autoreload] desactivat');
  }
}

$('chkAutoReload').addEventListener('change', (e) => setAutoReload(e.target.checked));

/* ===================== Accés per pla ===================== */
function minIndexFor(key) {
  const st = radar.getLayerState(key);
  if (!st || !st.initialized) return 0;
  const mins = ACCESS[tier].minutes;
  if (!isFinite(mins)) return 0;
  const ts = st.timestamps;
  let latest = null;
  for (let i = ts.length - 1; i >= 0; i--) { if (ts[i]) { latest = ts[i].getTime(); break; } }
  if (latest === null) return 0;
  const limit = latest - mins * 60000 - 1000;
  for (let i = 0; i < ts.length; i++) { if (ts[i] && ts[i].getTime() >= limit) return i; }
  return 0;
}

function computeAccess() {
  for (const k of Object.keys(PRODUCTS)) radar.setMinIndex(k, minIndexFor(k));
  const st = radar.getLayerState(activeKey);
  minIndex = st ? st.minIndex : 0;
  lockPct = totalFrames > 1 ? (minIndex / (totalFrames - 1)) * 100 : 0;
  const locked = $('timelineLocked'), lock = $('timelineLock');
  if (locked) locked.style.width = lockPct + '%';
  if (lock) {
    lock.style.display = lockPct > 0 ? 'block' : 'none';
    lock.style.left = (lockPct / 2) + '%';
  }
  $('timelineLabels').querySelectorAll('.timeline-label').forEach((el) => {
    el.classList.toggle('locked', parseFloat(el.style.left) < lockPct - 0.01);
  });
  lastRendered = -1;
  if (st && st.initialized) updateUI(Math.max(st.currentIndex, minIndex));
}

function requiredTierFor(idx) {
  const ts = timestamps;
  let latest = null;
  for (let i = ts.length - 1; i >= 0; i--) { if (ts[i]) { latest = ts[i].getTime(); break; } }
  const d = ts[idx];
  if (latest === null || !d) return 'free';
  const age = (latest - d.getTime()) / 60000;
  if (age <= ACCESS.anon.minutes) return 'anon';
  if (age <= ACCESS.free.minutes) return 'free';
  if (age <= ACCESS.entusiasta.minutes) return 'entusiasta';
  return 'professional';
}

function promptLocked(idx) {
  if (lockPrompted) return;
  lockPrompted = true;
  openUpsell(requiredTierFor(idx));
}

/* ===================== Upsell ===================== */
const PREUS_URL = 'https://tempestes.cat/privacitat/preus';
const DB_URL = 'https://tempestescat-default-rtdb.europe-west1.firebasedatabase.app';
const userName = (u) => (u.displayName || '').trim() || (u.email ? u.email.split('@')[0] : 'Usuari');

function openUpsell(need, custom) {
  const here = TIERS.indexOf(tier);
  const texts = {
    anon: ['Inicia sessió per veure més', 'Sense compte pots veure els últims 25 minuts. Amb un compte gratuït desbloqueges l\'hora sencera.', 'Iniciar sessió amb Google', () => loginGoogle()],
    free: ['Inicia sessió per veure 1 hora', 'Sense compte pots veure els últims 25 minuts. Amb un compte gratuït desbloqueges l\'hora sencera.', 'Iniciar sessió amb Google', () => loginGoogle()],
    entusiasta: ['Amplia fins a 3 hores', 'Aquest tram del radar és del pla Entusiasta.', 'Veure el pla Entusiasta', () => { location.href = PREUS_URL + '?pla=entusiasta'; }],
    professional: ['24 hores i arxiu', 'Aquest tram del radar i l\'arxiu històric són del pla Professional.', 'Veure el pla Professional', () => { location.href = PREUS_URL + '?pla=professional'; }],
  };
  let [title, text, cta, action] = texts[need] || texts.free;
  if (custom) { title = custom.title; text = custom.text; }
  $('upsellTitle').textContent = title;
  $('upsellText').textContent = text;
  const needIdx = TIERS.indexOf(need);
  $('upsellTiers').innerHTML = TIERS.map((k, i) => {
    const cls = ['tier-row', i <= here ? 'ok' : '', i === needIdx ? 'need' : '', i === here ? 'here' : ''].join(' ');
    return `<div class="${cls}"><b>${ACCESS[k].name}</b><span>${ACCESS[k].window}</span></div>`;
  }).join('');
  const primary = $('upsellPrimary');
  primary.textContent = cta;
  primary.onclick = action;
  $('upsell').classList.add('open');
  $('upsell').setAttribute('aria-hidden', 'false');
}

function closeUpsell() {
  $('upsell').classList.remove('open');
  $('upsell').setAttribute('aria-hidden', 'true');
}
$('upsellX').addEventListener('click', closeUpsell);
$('upsellSecondary').addEventListener('click', closeUpsell);
$('upsell').addEventListener('click', (e) => { if (e.target === $('upsell')) closeUpsell(); });

/* ===================== Firebase ===================== */
async function fetchPlan(u) {
  try {
    const token = await u.getIdToken();
    const r = await fetch(`${DB_URL}/users/${encodeURIComponent(u.uid)}/pla.json?auth=${token}`, { cache: 'no-store' });
    if (!r.ok) return 'gratuït';
    const k = String((await r.json()) || '').trim().toLowerCase().replace('gratuit', 'gratuït');
    return ['gratuït', 'entusiasta', 'professional', 'equips'].includes(k) ? k : 'gratuït';
  } catch (e) { return 'gratuït'; }
}

async function fetchIsAdmin(u) {
  if (!u || !u.email) return false;
  try {
    const token = await u.getIdToken();
    const k = u.email.toLowerCase().replace(/\./g, ',');
    const r = await fetch(`${DB_URL}/admin/${encodeURIComponent(k)}.json?auth=${token}`, { cache: 'no-store' });
    return r.ok && (await r.json()) === true;
  } catch (e) { return false; }
}

let auth = null, fb = null;

const authReady = (async () => {
  try {
    const [appMod, authMod] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js'),
    ]);
    fb = authMod;
    auth = authMod.getAuth(appMod.initializeApp({
      apiKey: "AIzaSyBGcGUk2gsoDaHkg9Yv-nqMJ5_x-QPTMS8",
      authDomain: "tempestescat.firebaseapp.com",
      projectId: "tempestescat",
      storageBucket: "tempestescat.firebasestorage.app",
      messagingSenderId: "683240351775",
      appId: "1:683240351775:web:bc65d73249537b9cc28d2a",
    }));

    authMod.onAuthStateChanged(auth, async (u) => {
      currentUser = u;
      if (!u) { tier = 'anon'; planLabel = ''; accessChanged(); return; }
      tier = 'free'; planLabel = 'Gratuït';
      accessChanged();
      const [plan, admin] = await Promise.all([fetchPlan(u), fetchIsAdmin(u)]);
      if (currentUser !== u) return;
      if (admin) { tier = 'professional'; planLabel = 'Admin'; }
      else if (plan === 'entusiasta') { tier = 'entusiasta'; planLabel = 'Entusiasta'; }
      else if (plan === 'professional' || plan === 'equips') { tier = 'professional'; planLabel = plan === 'equips' ? 'Equips' : 'Professional'; }
      else { tier = 'free'; planLabel = 'Gratuït'; }
      accessChanged();
    });
  } catch (e) { console.warn('[firebase]', e); }
})();

async function loginGoogle() {
  try {
    await authReady;
    if (!auth || !fb) return;
    await fb.signInWithPopup(auth, new fb.GoogleAuthProvider());
    closeUpsell();
    closeAllFlyouts();
  } catch (e) { console.error(e); }
}

async function logout() {
  try {
    await authReady;
    if (auth && fb) await fb.signOut(auth);
  } catch (e) { console.error(e); }
}

function humanAuthError(err) {
  const code = (err && err.code) || '';
  if (code === 'auth/invalid-email') return 'Correu no vàlid.';
  if (code === 'auth/missing-password') return 'Falta la contrasenya.';
  if (code === 'auth/weak-password') return 'La contrasenya ha de tenir com a mínim 6 caràcters.';
  if (code === 'auth/email-already-in-use') return 'Aquest correu ja té un compte.';
  if (code === 'auth/user-not-found' || code === 'auth/wrong-password' || code === 'auth/invalid-credential') return 'Correu o contrasenya incorrectes.';
  if (code === 'auth/too-many-requests') return 'Massa intents. Torna-ho a provar més tard.';
  if (code === 'auth/operation-not-allowed') return 'El mètode correu/contrasenya no està activat.';
  if (code === 'auth/unauthorized-domain') return 'Aquest domini no està autoritzat.';
  return (err && err.message) || 'Error inesperat.';
}

function updateAccountUI() {
  const userBtn = $('userBtn');
  const accountBox = $('accountBox');
  const chipPlan = $('chipPlan');
  if (chipPlan) chipPlan.textContent = `${ACCESS[tier].name} · ${ACCESS[tier].window}`;
  if (!accountBox) return;

  if (!currentUser) {
    if (userBtn) userBtn.innerHTML = `<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg><span class="label">Perfil</span>`;
    accountBox.innerHTML = `
      <div class="acc-line"><span>Historial visible</span><span class="acc-badge">${ACCESS.anon.window}</span></div>
      <div class="info-text">Inicia sessió o crea un compte per desbloquejar més historial.</div>
      <div class="acc-actions"><button class="primary" id="accGoogle">Continuar amb Google</button></div>
      <div id="authFormWrap">
        <form class="auth-form" id="authForm">
          <input type="email" name="email" placeholder="Correu electrònic" autocomplete="email" required />
          <input type="password" name="password" placeholder="Contrasenya" autocomplete="current-password" minlength="6" required />
          <div class="auth-error" id="authError"></div>
          <button class="primary" type="submit" id="authSubmit">Iniciar sessió</button>
        </form>
        <button class="auth-toggle" id="authToggle">No tinc compte · Crear-ne un</button>
      </div>`;
    $('accGoogle').addEventListener('click', loginGoogle);
    let mode = 'login';
    const form = $('authForm');
    const submitBtn = $('authSubmit');
    const toggle = $('authToggle');
    const errEl = $('authError');
    toggle.addEventListener('click', () => {
      mode = mode === 'login' ? 'register' : 'login';
      submitBtn.textContent = mode === 'register' ? 'Crear compte' : 'Iniciar sessió';
      toggle.textContent = mode === 'register' ? 'Ja tinc compte · Iniciar sessió' : 'No tinc compte · Crear-ne un';
      form.querySelector('input[name="password"]').setAttribute('autocomplete', mode === 'register' ? 'new-password' : 'current-password');
      errEl.textContent = '';
    });
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.textContent = '';
      const email = (form.querySelector('input[name="email"]').value || '').trim();
      const password = (form.querySelector('input[name="password"]').value || '');
      try {
        submitBtn.disabled = true; submitBtn.textContent = 'Espera…';
        await authReady;
        if (!auth || !fb) throw new Error('Firebase no disponible');
        if (mode === 'register') await fb.createUserWithEmailAndPassword(auth, email, password);
        else await fb.signInWithEmailAndPassword(auth, email, password);
        closeAllFlyouts();
      } catch (err) {
        errEl.textContent = humanAuthError(err);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = mode === 'register' ? 'Crear compte' : 'Iniciar sessió';
      }
    });
    return;
  }

  const nom = userName(currentUser);
  const ini = escapeHtml(nom[0] ? nom[0].toUpperCase() : '?');
  const avatar = currentUser.photoURL
    ? `<img src="${escapeHtml(currentUser.photoURL)}" alt="" referrerpolicy="no-referrer">` : ini;
  if (userBtn) {
    userBtn.innerHTML = currentUser.photoURL
      ? `<img src="${escapeHtml(currentUser.photoURL)}" alt="" referrerpolicy="no-referrer">`
      : `<span class="ini">${ini}</span><span class="label">Perfil</span>`;
  }
  accountBox.innerHTML = `
    <div class="acc-who">
      <div class="acc-av">${avatar}</div>
      <div style="min-width:0"><div class="acc-name">${escapeHtml(nom)}</div><div class="acc-mail">${escapeHtml(currentUser.email || '')}</div></div>
    </div>
    <div class="acc-line"><span>Pla</span><span class="acc-badge">${escapeHtml(planLabel || ACCESS[tier].name)}</span></div>
    <div class="acc-line"><span>Historial visible</span><span>${ACCESS[tier].window}</span></div>
    <div class="acc-actions">
      ${tier !== 'professional' ? `<a class="primary" href="${PREUS_URL}" target="_blank" rel="noopener">Veure plans / Comprar</a>` : `<a class="primary" href="${PREUS_URL}" target="_blank" rel="noopener">Gestionar pla</a>`}
      <button id="accLogout">Tancar sessió</button>
    </div>`;
  $('accLogout').addEventListener('click', logout);
}

function accessChanged() {
  computeAccess();
  updateAccountUI();
}

$('userBtn').addEventListener('click', (e) => {
  e.preventDefault();
  e.stopPropagation();
  if (UI.open === 'settings') { closeAllFlyouts(); return; }

radar.onLayerUpdate((key) => {
  if (key === activeKey) syncTimeline(key);

/* ===================== Map load ===================== */
map.once('style.load', async () => {
  setLoad(35, 'Carregant el radar…');
  hideBaseLabels();
  alertes.start().catch(() => {});
  try {
    await radar.initRadar(map);
  } catch (e) {
    console.error('[radar]', e);
    setStatus('No s\'ha pogut carregar el radar.');
    setLoad(100, 'Error');
    setTimeout(hideLoader, 800);
    return;
  }

  // Forçar estat inicial: relleu OFF, autoreload ON
  $('chkRelleu').checked = false;
  radar.setReliefVisibility(false);

  const available = Object.keys(PRODUCTS).filter((k) => {
    const s = radar.getLayerState(k);
    return s && s.initialized && s.totalFrames > 0;
  });
  document.querySelectorAll('#flyout-productSelect .opt').forEach((o) => {
    o.disabled = !available.includes(o.dataset.product);
  });

  if (available.length === 0) {
    setStatus('No hi ha cap imatge disponible.');
    setLoad(100, 'Sense dades');
    setTimeout(hideLoader, 800);
    return;
  }

  await selectProduct(available.includes('dbz') ? 'dbz' : available[0]);
  radar.startAllAnimations();

  // Activar autoreload per defecte (respectant si l'usuari l'havia desactivat explícitament)
  let arStored = null;
  try { arStored = localStorage.getItem('radar.autoreload'); } catch (_) {}
  if (arStored !== '0') {
    setAutoReload(true);
  } else {
    $('chkAutoReload').checked = false;
  }

  setLoad(100, 'A punt!');
  hideLoader();
  appReady = true;
});
</script>
