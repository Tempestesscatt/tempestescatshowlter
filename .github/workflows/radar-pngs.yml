name: Descarga Radar

on:
  workflow_dispatch: {}  # Execució manual (o cridat per un cron extern)

permissions:
  contents: read  # ja no cal 'write': no tornem a commitejar res al repo

env:
  R2_BUCKET: tempestes-radar-data
  R2_PREFIX_RAD: dades_rad/

  # Ruta REAL on rad.py escriu els fitxers:
  # rad.py viu a scripts-privats/ i escriu a la carpeta
  # germana radar/public/dades_rad.
  DADES_RAD_DIR: scripts-privats/radar/public/dades_rad

  # Frames del radar:
  # frame_1 = més recent
  # frame_5 = més antic
  # + el fitxer de metadata que escriu rad.py.
  REQUIRED_FILES_RAD: >-
    meteorad_ne_spain_dbz_frame_1.msgpack.gz
    meteorad_ne_spain_dbz_frame_2.msgpack.gz
    meteorad_ne_spain_dbz_frame_3.msgpack.gz
    meteorad_ne_spain_dbz_frame_4.msgpack.gz
    meteorad_ne_spain_dbz_frame_5.msgpack.gz
    meteorad_ne_spain_metadata.msgpack.gz

jobs:

  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    outputs:
      files_ok: ${{ steps.verify.outputs.files_ok }}

    steps:

      - name: Clonar repositori (sense submòduls)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Configurar clau SSH per al submòdul privat
        env:
          DEPLOY_KEY_B64: ${{ secrets.SUBMODULE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$DEPLOY_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config --global core.sshCommand "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -T git@github.com || true

      - name: Inicialitzar submòdul privat (scripts-privats)
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth=1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instal·lar dependències
        run: |
          set -euo pipefail

          # rad.py només necessita:
          # - requests per baixar de l'API de Meteo-France
          # - h5py per llegir HDF5 OPERA
          # - numpy
          # - msgpack per serialitzar
          # - pyproj per reprojectar coordenades
          #
          # Molt més lleuger perquè ja NO descarreguem ni processem satèl·lit.

          pip install requests h5py numpy msgpack-python pyproj
          pip check || true

      - name: Executar rad.py
        id: run_rad
        env:
          METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
        run: |
          python -X faulthandler scripts-privats/rad.py

        # rad.py viu al submòdul privat 'scripts-privats/'.
        # S'executa des de l'arrel del repo perquè el seu OUTPUT_DIR
        # es calcula relatiu a la seva pròpia ubicació:
        #
        # scripts-privats/radar/public/dades_rad
        #
        # No tallem el job si rad.py acaba amb un error puntual:
        # la comprovació real de si és publicable la fa 'verify'.

        continue-on-error: true

      - name: Verificar que els fitxers generats són complets i vàlids
        id: verify
        run: |
          set -euo pipefail

          cd "$DADES_RAD_DIR"

          ok="true"
          missing=""

          for f in $REQUIRED_FILES_RAD; do
            if [ ! -s "$f" ]; then
              ok="false"
              missing="$missing $f"
            fi
          done

          if [ "$ok" = "false" ]; then
            echo "ERROR: Falten fitxers o estan buits:$missing"
            echo "files_ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "OK: tots els fitxers requerits presents i amb contingut"
            echo "files_ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Marcar job com a fallit si falten dades
        if: steps.verify.outputs.files_ok != 'true'
        run: |
          echo "::error::Cicle de radar incomplet: no es publicarà a R2 per evitar dades a mitges."
          exit 1

      - name: Pujar resultat com a artifact (temporal)
        if: steps.verify.outputs.files_ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dades-radar
          path: ${{ env.DADES_RAD_DIR }}/
          retention-days: 1
          if-no-files-found: error


  publicar:
    needs: radar

    # NOMÉS es publica si el job del radar ha generat
    # tots els fitxers correctament.
    if: needs.radar.outputs.files_ok == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 8

    concurrency:
      group: radar-update
      cancel-in-progress: false
      # mai cancel·lar a mitges una pujada a R2

    steps:

      - name: Descarregar artifact radar
        uses: actions/download-artifact@v4
        with:
          name: dades-radar
          path: dades_rad/

      - name: Verificar altre cop abans de publicar
        run: |
          set -euo pipefail

          cd dades_rad

          for f in $REQUIRED_FILES_RAD; do
            if [ ! -s "$f" ]; then
              echo "::error::Fitxer $f absent o buit just abans de publicar. Avortant."
              exit 1
            fi
          done

          cd ..

          echo "OK: verificació radar prèvia a publicar correcta"

      - name: Pujar a R2 (només radar)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          fail_count=0

          upload_one() {
            local f="$1"
            local ct="$2"
            local dest="$3"
            local attempt=1
            local max_attempts=3

            while [ "$attempt" -le "$max_attempts" ]; do

              echo "Pujant ($attempt/$max_attempts): $dest"

              if npx wrangler r2 object put "$dest" \
                   --file="$f" \
                   --remote \
                   --content-type="$ct"; then

                return 0
              fi

              echo "Fallada pujant $dest, reintentant..."

              attempt=$((attempt + 1))

              sleep 3

            done

            return 1
          }


          # -------------------------------------------------
          # NOMÉS RADAR
          # -------------------------------------------------

          if [ -d dades_rad ]; then

            cd dades_rad

            for f in *.msgpack.gz; do

              [ -f "$f" ] || continue

              ct="application/octet-stream"

              if ! upload_one "$f" "$ct" "${R2_BUCKET}/${R2_PREFIX_RAD}$f"; then

                echo "ERROR: no s'ha pogut pujar $f (radar) després de tots els intents"

                fail_count=$((fail_count + 1))

              fi

            done

            cd ..

          fi


          # -------------------------------------------------
          # RESULTAT FINAL
          # -------------------------------------------------

          if [ "$fail_count" -gt 0 ]; then

            echo "::error::$fail_count fitxer(s) no s'han pogut pujar a R2"

            exit 1

          fi

          echo "OK: dades de radar pujades a R2."
          echo "No s'ha descarregat ni processat cap dada de satèl·lit."
          echo "No queda cap còpia al repositori."