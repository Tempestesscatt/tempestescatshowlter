name: Descarga SFC + Geopotencial 500hPa + Vent 500hPa

on:
  workflow_dispatch: {}  # Execució manual
  schedule:
    - cron: '*/30 * * * *'  # Cada 30 minuts

permissions:
  contents: read

env:
  R2_BUCKET: tempestes-radar-data
  R2_PREFIX_SFC: dades_sfc/

jobs:
  sfc:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      files_ok: ${{ steps.verify.outputs.files_ok }}

    steps:
      - name: Clonar repositori (sense submòduls)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Configurar clau SSH per al submòdul privat
        env:
          DEPLOY_KEY_B64: ${{ secrets.SUBMODULE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$DEPLOY_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config --global core.sshCommand "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -T git@github.com || true

      - name: Inicialitzar submòdul privat (scripts-privats)
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth=1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instal·lar dependències del sistema
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev libeccodes0 eccodes
          # També instal·lar eines de compilació per si cal
          sudo apt-get install -y build-essential

      - name: Instal·lar dependències Python
        run: |
          set -euo pipefail
          # Dependències per sfc.py - incloent cfgrib per GRIB
          pip install requests numpy msgpack-python pyproj cfgrib eccodes
          pip check || true

      - name: Verificar estructura de directoris del submòdul
        run: |
          echo "Contingut de scripts-privats:"
          ls -la scripts-privats/
          echo ""
          echo "Buscant sfc.py:"
          find . -name "sfc.py" -type f
          echo ""
          echo "Buscant directoris de sortida potencials:"
          find . -type d -name "dades_sfc" 2>/dev/null || echo "No s'ha trobat cap directori dades_sfc"
          find . -type d -name "public" 2>/dev/null || echo "No s'ha trobat cap directori public"
          echo ""
          echo "Estructura de scripts-privats:"
          find scripts-privats/ -maxdepth 3 -type d

      - name: Executar sfc.py
        id: run_sfc
        env:
          METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
        run: |
          python -X faulthandler scripts-privats/sfc.py
        continue-on-error: true

      - name: Localitzar fitxers SFC generats
        id: locate
        run: |
          set -euo pipefail
          echo "Buscant fitxers SFC generats:"
          
          # Buscar fitxers msgpack.gz a tot el repositori
          find . -name "sfc_*.msgpack.gz" -type f -exec ls -lh {} \; > sfc_files.txt || true
          
          # Buscar qualsevol fitxer msgpack.gz recent
          find . -name "*.msgpack.gz" -type f -mmin -15 -exec ls -lh {} \; >> sfc_files.txt || true
          
          cat sfc_files.txt || echo "No s'han trobat fitxers"
          
          # Determinar el directori correcte
          if [ -s sfc_files.txt ]; then
            first_file=$(find . -name "sfc_*.msgpack.gz" -type f | head -n 1)
            if [ -n "$first_file" ]; then
              sfc_dir=$(dirname "$first_file")
              echo "SFC_DIR=$sfc_dir" >> "$GITHUB_OUTPUT"
              echo "Directori SFC: $sfc_dir"
            fi
          fi

      - name: Verificar que els fitxers generats són complets i vàlids
        id: verify
        run: |
          set -euo pipefail
          
          # Buscar fitxers SFC a tot el repositori
          valid_count=$(find . -name "sfc_*.msgpack.gz" -size +0c | wc -l)
          
          if [ "$valid_count" -eq 0 ]; then
            echo "ERROR: No hi ha cap fitxer SFC vàlid"
            echo "files_ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "OK: $valid_count fitxers SFC vàlids disponibles"
            
            # Llistar els fitxers disponibles
            echo "Fitxers disponibles:"
            find . -name "sfc_*.msgpack.gz" -size +0c -exec ls -lh {} \;
            
            echo "files_ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Marcar job com a fallit si no hi ha dades
        if: steps.verify.outputs.files_ok != 'true'
        run: |
          echo "::error::No s'han generat dades SFC vàlides. Avortant."
          exit 1

      - name: Pujar resultat com a artifact (temporal)
        if: steps.verify.outputs.files_ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dades-sfc
          path: |
            **/sfc_*.msgpack.gz
            **/dades_sfc/*.msgpack.gz
          retention-days: 1
          if-no-files-found: error

  publicar:
    needs: sfc
    if: needs.sfc.outputs.files_ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: sfc-update
      cancel-in-progress: false

    steps:
      - name: Descarregar artifact SFC
        uses: actions/download-artifact@v4
        with:
          name: dades-sfc
          path: dades_sfc/

      - name: Verificar estructura dels fitxers descarregats
        run: |
          echo "Estructura després de descarregar:"
          find . -name "sfc_*.msgpack.gz" -type f -exec ls -lh {} \;
          
          # Comptar fitxers vàlids
          valid_count=$(find . -name "sfc_*.msgpack.gz" -size +0c | wc -l)
          echo "Fitxers vàlids: $valid_count"
          
          if [ "$valid_count" -eq 0 ]; then
            echo "::error::Cap fitxer SFC vàlid per publicar. Avortant."
            exit 1
          fi

      - name: Pujar a R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          fail_count=0

          upload_one() {
            local f="$1"
            local ct="$2"
            local dest="$3"
            local attempt=1
            local max_attempts=3

            while [ "$attempt" -le "$max_attempts" ]; do
              echo "Pujant ($attempt/$max_attempts): $dest"
              if npx wrangler r2 object put "$dest" \
                   --file="$f" --remote --content-type="$ct"; then
                return 0
              fi
              echo "Fallada pujant $dest, reintentant..."
              attempt=$((attempt + 1))
              sleep 3
            done
            return 1
          }

          # Trobar tots els fitxers SFC
          find . -name "sfc_*.msgpack.gz" -type f | while read -r f; do
            filename=$(basename "$f")
            echo "Pujant: $filename"
            if ! upload_one "$f" "application/octet-stream" "${R2_BUCKET}/${R2_PREFIX_SFC}$filename"; then
              echo "ERROR: no s'ha pogut pujar $filename després de tots els intents"
              fail_count=$((fail_count + 1))
            fi
          done

          if [ "$fail_count" -gt 0 ]; then
            echo "::error::$fail_count fitxer(s) no s'han pogut pujar a R2"
            exit 1
          fi

          echo "OK: Dades SFC pujades a R2 correctament"

  actualizar_frontend:
    needs: publicar
    runs-on: ubuntu-latest
    timeout-minutes: 3
    
    steps:
      - name: Notificar actualització completada
        run: |
          echo "SFC actualitzat a R2"
          echo "El frontend pot actualitzar les dades des de:"
          echo "https://${R2_BUCKET}.r2.dev/${R2_PREFIX_SFC}sfc_$(date -u +%H).msgpack.gz"