name: Actualitza dades radar

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  R2_BUCKET: tempestes-radar-data
  R2_PREFIX: radar/

jobs:
  actualitzar-dades:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: radar-update
      cancel-in-progress: true

    steps:
      - name: Clonar repositori
        uses: actions/checkout@v4

      - name: Crear carpetes de dades
        run: |
          mkdir -p radar/public/radar

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instal·lar dependències del sistema (HDF5)
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev

      - name: Instal·lar dependències de Python
        run: |
          python -m pip install --upgrade pip
          pip install requests h5py numpy pyproj

      # ─────────────────────────────────────────────────────────────
      # PURGA TOTAL: esborra TOT el contingut existent a R2 sota el
      # prefix radar/ (frames .js i .json d'estat inclosos), amb
      # paginacio per si hi ha mes de 1000 objectes. Aixi radar.py
      # sempre comença de zero net, sense arrossegar frames vells.
      # Si l'esborrat falla, el job s'atura (exit 1) en comptes de
      # continuar silenciosament amb dades a mig esborrar.
      # ─────────────────────────────────────────────────────────────
      - name: Purgar TOT el contingut de R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e

          CURSOR=""
          TOTAL_DELETED=0

          while :; do
            URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${R2_BUCKET}/objects?prefix=${R2_PREFIX}&per_page=1000"
            if [ -n "$CURSOR" ]; then
              URL="${URL}&cursor=${CURSOR}"
            fi

            echo "Llistant objectes (cursor: ${CURSOR:-cap})..."
            HTTP_CODE=$(curl -s -o /tmp/r2-list.json -w "%{http_code}" \
              "$URL" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")

            if [ "$HTTP_CODE" != "200" ]; then
              echo "ERROR: llistat ha fallat (HTTP $HTTP_CODE)"
              cat /tmp/r2-list.json 2>/dev/null || true
              exit 1
            fi

            SUCCESS=$(jq -r '.success' /tmp/r2-list.json)
            if [ "$SUCCESS" != "true" ]; then
              echo "ERROR: l'API ha respost success=false"
              jq -c '.errors' /tmp/r2-list.json 2>/dev/null || true
              exit 1
            fi

            KEYS_JSON=$(jq -c '[.result[]?.key // empty | select(length > 0)]' /tmp/r2-list.json)
            COUNT=$(echo "$KEYS_JSON" | jq 'length')
            echo "Objectes trobats en aquesta pagina: $COUNT"

            if [ "$COUNT" -gt 0 ]; then
              DEL_HTTP_CODE=$(curl -s -o /tmp/r2-delete.json -w "%{http_code}" \
                -X DELETE \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${R2_BUCKET}/objects" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" \
                --data "{\"keys\": ${KEYS_JSON}}")

              echo "HTTP esborrat: $DEL_HTTP_CODE"
              cat /tmp/r2-delete.json
              echo ""

              if [ "$DEL_HTTP_CODE" != "200" ]; then
                echo "ERROR: l'esborrat batch ha fallat (HTTP $DEL_HTTP_CODE)"
                exit 1
              fi

              TOTAL_DELETED=$((TOTAL_DELETED + COUNT))
            fi

            # Comprova si hi ha mes pagines (truncated + cursor)
            TRUNCATED=$(jq -r '.result_info.is_truncated // false' /tmp/r2-list.json)
            NEW_CURSOR=$(jq -r '.result_info.cursor // empty' /tmp/r2-list.json)

            if [ "$TRUNCATED" = "true" ] && [ -n "$NEW_CURSOR" ]; then
              CURSOR="$NEW_CURSOR"
            else
              break
            fi
          done

          echo "=== Purga completada. Total objectes esborrats: ${TOTAL_DELETED} ==="

      - name: Executar radar.py (CIRRUS / dBZ + NIMBUS / mm)
        env:
          METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          cd radar
          python -u radar.py

      - name: Mostrar contingut generat
        run: |
          echo "--- public/radar (despres d'executar radar.py) ---"
          ls -la radar/public/radar/ 2>/dev/null || echo "buit"

      - name: Pujar dades a R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for f in radar/public/radar/*.js radar/public/radar/*.json; do
            [ -e "$f" ] || continue
            nom="$(basename "$f")"
            case "$nom" in
              *.json) content_type="application/json" ;;
              *) content_type="application/javascript" ;;
            esac
            npx wrangler r2 object put "${R2_BUCKET}/${R2_PREFIX}${nom}" \
              --file="$f" --remote --content-type="$content_type"
          done
