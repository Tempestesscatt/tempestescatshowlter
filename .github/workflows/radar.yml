name: Actualitza dades radar

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  R2_BUCKET: tempestes-radar-data
  R2_PREFIX: radar/

jobs:
  actualitzar:
    runs-on: ubuntu-latest
    concurrency:
      group: radar-update
      cancel-in-progress: true
    
    steps:
      - name: Clonar repositori
        uses: actions/checkout@v4

      - name: Crear carpetes
        run: mkdir -p radar/public/radar

      - name: Baixar fitxers d'estat
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd radar/public/radar
          for f in nimbus_daily_state.json radar_daily_nimbus.js; do
            npx wrangler r2 object get "${R2_BUCKET}/${R2_PREFIX}$f" \
              --remote --file="$f" 2>/dev/null || echo "$f no existeix"
          done

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instal·lar dependències
        run: |
          sudo apt-get update && sudo apt-get install -y libhdf5-dev
          pip install requests h5py numpy pyproj

      - name: Executar radar.py
        env:
          METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          cd radar
          python -u radar.py

      - name: Pujar a R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd radar/public/radar
          
          # Pujar fitxers d'estat (sempre)
          for f in nimbus_daily_state.json radar_daily_nimbus.js radar_metadata.js status.js; do
            [ -f "$f" ] || continue
            ct="application/json"
            [[ "$f" == *.js ]] && ct="application/javascript"
            echo "⬆️ $f"
            npx wrangler r2 object put "${R2_BUCKET}/${R2_PREFIX}$f" \
              --file="$f" --remote --content-type="$ct"
          done
          
          # Pujar només els últims 5 frames
          echo "📤 Pujant últims 5 frames..."
          ls -1t radar_frame_*.js 2>/dev/null | head -5 | while IFS= read -r frame; do
            echo "⬆️ $frame"
            npx wrangler r2 object put "${R2_BUCKET}/${R2_PREFIX}$frame" \
              --file="$frame" --remote --content-type="application/javascript"
          done
          
          echo "✅ Tot pujat!"
