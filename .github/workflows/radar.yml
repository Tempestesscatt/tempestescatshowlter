name: Actualitza dades radar

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  R2_BUCKET: tempestes-radar-data
  R2_PREFIX: radar/

jobs:
  preparar-entorn:
    runs-on: ubuntu-latest
    concurrency:
      group: radar-update
      cancel-in-progress: true
    
    steps:
      - name: Clonar repositori
        uses: actions/checkout@v4

      - name: Crear carpetes de dades
        run: mkdir -p radar/public/radar

      - name: Baixar només els últims 5 frames i fitxers d'estat
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd radar/public/radar
          
          echo "📥 Descarregant fitxers essencials + últims 5 frames..."
          
          # 1. Fitxers d'estat (sempre)
          for f in nimbus_daily_state.json radar_daily_nimbus.js radar_metadata.js status.js; do
            echo "  ⬇️ $f"
            npx wrangler r2 object get "${R2_BUCKET}/${R2_PREFIX}$f" \
              --remote --file="$f" 2>/dev/null || echo "    ℹ️ $f no existeix"
          done
          
          # 2. Llistar tots els frames i agafar els últims 5
          echo "  🔍 Buscant els últims 5 frames..."
          HTTP_CODE=$(curl -s -o /tmp/r2-list.json -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${R2_BUCKET}/objects?prefix=${R2_PREFIX}radar_frame_&per_page=1000" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          
          if [ "$HTTP_CODE" = "200" ] && [ "$(jq -r '.success' /tmp/r2-list.json)" = "true" ]; then
            # Ordenar per data i agafar els últims 5
            ULTIMS_FRAMES=$(jq -r '.result[]?.key // empty' /tmp/r2-list.json | sort -r | head -5)
            
            if [ -n "$ULTIMS_FRAMES" ]; then
              echo "$ULTIMS_FRAMES" | while IFS= read -r key; do
                [ -z "$key" ] && continue
                nom="${key#${R2_PREFIX}}"
                echo "  ⬇️ $nom"
                npx wrangler r2 object get "${R2_BUCKET}/${key}" \
                  --remote --file="$nom" 2>/dev/null || echo "    ⚠️ Error descarregant $nom"
              done
            else
              echo "  ℹ️ No hi ha frames anteriors"
            fi
          fi
          
          echo "--- Contingut descarregat ---"
          ls -lh . 2>/dev/null || echo "buit"
          echo "Total: $(ls -1 | wc -l) fitxers"

      - name: Pujar artefacte
        uses: actions/upload-artifact@v4
        with:
          name: dades-existents
          path: radar/public/radar/
          retention-days: 1

  executar-radar:
    needs: preparar-entorn
    runs-on: ubuntu-latest
    concurrency:
      group: radar-update
      cancel-in-progress: true
    
    steps:
      - name: Clonar repositori
        uses: actions/checkout@v4

      - name: Crear carpetes de dades
        run: mkdir -p radar/public/radar

      - name: Descarregar dades existents
        uses: actions/download-artifact@v4
        with:
          name: dades-existents
          path: radar/public/radar/

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instal·lar dependències
        run: |
          sudo apt-get update && sudo apt-get install -y libhdf5-dev
          pip install requests h5py numpy pyproj

      - name: Executar radar.py
        env:
          METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          cd radar
          python -u radar.py

      - name: Mantenir només últims 5 frames
        run: |
          cd radar/public/radar
          
          echo "🧹 Netejant frames antics, guardant només últims 5..."
          
          # Llistar frames JS (excloent radar_daily_nimbus.js)
          FRAMES=$(ls -1 radar_frame_*.js 2>/dev/null | sort -r)
          TOTAL=$(echo "$FRAMES" | wc -l)
          
          if [ "$TOTAL" -gt 5 ]; then
            # Mantenir els 5 primers (més recents) i eliminar la resta
            echo "$FRAMES" | tail -n +6 | while IFS= read -r frame; do
              echo "  🗑️ Eliminant $frame"
              rm "$frame"
            done
            echo "✅ Eliminats $((TOTAL - 5)) frames antics"
          else
            echo "ℹ️ Només hi ha $TOTAL frames (≤ 5), no cal eliminar"
          fi
          
          echo "📊 Frames restants:"
          ls -lh radar_frame_*.js 2>/dev/null || echo "cap"

      - name: Pujar artefacte
        uses: actions/upload-artifact@v4
        with:
          name: dades-processades
          path: radar/public/radar/
          retention-days: 1

  pujar-a-r2:
    needs: executar-radar
    runs-on: ubuntu-latest
    concurrency:
      group: radar-update
      cancel-in-progress: true
    
    steps:
      - name: Descarregar resultats
        uses: actions/download-artifact@v4
        with:
          name: dades-processades
          path: radar/public/radar/

      - name: Pujar a R2 i netejar bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd radar/public/radar
          
          echo "📤 Pujant fitxers nous..."
          
          # Pujar fitxers d'estat i frames
          for f in nimbus_daily_state.json radar_daily_nimbus.js radar_metadata.js status.js radar_frame_*.js; do
            [ -e "$f" ] || continue
            [ ! -s "$f" ] && continue
            
            case "$f" in
              *.json) ct="application/json" ;;
              *.js) ct="application/javascript" ;;
            esac
            
            echo "  ⬆️ $f"
            npx wrangler r2 object put "${R2_BUCKET}/${R2_PREFIX}${f}" \
              --file="$f" --remote --content-type="$ct"
          done
          
          # Eliminar frames antics del bucket (mantenir només 5)
          echo "🧹 Netejant bucket (frames antics)..."
          
          HTTP_CODE=$(curl -s -o /tmp/r2-list.json -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${R2_BUCKET}/objects?prefix=${R2_PREFIX}radar_frame_&per_page=1000" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          
          if [ "$HTTP_CODE" = "200" ] && [ "$(jq -r '.success' /tmp/r2-list.json)" = "true" ]; then
            FRAMES_ANTICS=$(jq -r '.result[]?.key // empty' /tmp/r2-list.json | sort -r | tail -n +6)
            
            if [ -n "$FRAMES_ANTICS" ]; then
              echo "$FRAMES_ANTICS" | while IFS= read -r key; do
                [ -z "$key" ] && continue
                echo "  🗑️ Eliminant $key"
                npx wrangler r2 object delete "${R2_BUCKET}/${key}" --remote
              done
              echo "✅ Bucket netejat"
            else
              echo "ℹ️ No hi ha frames per eliminar"
            fi
          fi
          
          echo "✅ Tot completat!"
