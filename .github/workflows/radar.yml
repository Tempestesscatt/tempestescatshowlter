name: Descarga Radar PNG

on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: descarga-radar-png
  cancel-in-progress: false

env:
  R2_BUCKET: tempestes-radar-data
  R2_PREFIX_DBZ: dades_radar_dbz/
  R2_PREFIX_VRADH: dades_radar_vradh/
  DADES_PNG_DIR: scripts-privats/radar_out
  R2_PUBLIC_BASE: https://radar-data.tempestes.cat

jobs:

  radar-png:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      files_ok: ${{ steps.verify.outputs.files_ok }}

    steps:

      - name: Clonar repositori (sense submòduls)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Configurar clau SSH per al submòdul privat
        env:
          DEPLOY_KEY_B64: ${{ secrets.SUBMODULE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$DEPLOY_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config --global core.sshCommand "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no"

      - name: Inicialitzar submòdul privat
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth=1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instal·lar dependències
        run: |
          set -euo pipefail
          pip install --quiet requests h5py numpy pillow pyproj
          pip check || true

      - name: Executar radar-real.py
        env:
          METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
          RADAR_SECRET_KEY: ${{ secrets.RADAR_SECRET_KEY }}
          METEOGATE_API_KEY: ${{ secrets.METEOGATE_API_KEY }}
          RADAR_FINESTRA_HORES: '26'
          RADAR_TIMEZONE: 'Europe/Madrid'
          R2_PUBLIC_BASE: ${{ env.R2_PUBLIC_BASE }}
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
        run: python -X faulthandler scripts-privats/radar-real.py
        continue-on-error: true

      - name: Verificar manifests i PNGs
        id: verify
        run: |
          set -euo pipefail
          ok=true
          n_total=0

          declare -A SUBS=(
            ["dbz"]="dades_radar_dbz"
            ["vradh"]="dades_radar_vradh"
          )

          for sub in "${!SUBS[@]}"; do
            dir="$DADES_PNG_DIR/${SUBS[$sub]}"
            echo "--- Comprovant $sub ($dir) ---"
            if [ ! -d "$dir" ]; then
              echo "AVIS: no existeix $dir"
              ok=false
              continue
            fi
            if [ ! -s "$dir/manifest.json" ]; then
              echo "ERROR: falta $dir/manifest.json"
              ok=false
              continue
            fi
            n=$(find "$dir" -maxdepth 1 -type d -name "es*" | wc -l)
            n_png=$(find "$dir" -maxdepth 2 -name "*.png" | wc -l)
            echo "$sub: $n_png PNGs en $n carpetes de radar"
            n_total=$((n_total + n_png))
          done

          echo "Total PNGs: $n_total"

          if [ "$ok" != "true" ] || [ "$n_total" -eq 0 ]; then
            echo "files_ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "files_ok=true" >> "$GITHUB_OUTPUT"

      - name: Pujar artifact radar-png
        if: steps.verify.outputs.files_ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dades-radar-png
          path: ${{ env.DADES_PNG_DIR }}/
          retention-days: 1
          if-no-files-found: error

  publicar:
    needs: [radar-png]
    if: |
      always() &&
      needs.radar-png.outputs.files_ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:

      - name: Descarregar artifact radar-png
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: dades-radar-png
          path: dades_png/

      - name: Verificar què tenim
        id: check
        run: |
          set -euo pipefail

          echo "=== dBZ ==="
          ls -la dades_png/dades_radar_dbz/ || echo "no existeix"
          ok_dbz=false
          if [ -s "dades_png/dades_radar_dbz/manifest.json" ]; then
            ok_dbz=true
          fi

          echo "=== VRADH ==="
          ls -la dades_png/dades_radar_vradh/ || echo "no existeix"
          ok_vradh=false
          if [ -s "dades_png/dades_radar_vradh/manifest.json" ]; then
            ok_vradh=true
          fi

          echo "dbz_ok=$ok_dbz" >> "$GITHUB_OUTPUT"
          echo "vradh_ok=$ok_vradh" >> "$GITHUB_OUTPUT"

          if [ "$ok_dbz" != "true" ]; then
            echo "::error::No hi ha dades dBZ per publicar"
            exit 1
          fi

      - name: Pujar a R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ env.R2_BUCKET }}
          R2_PREFIX_DBZ: ${{ env.R2_PREFIX_DBZ }}
          R2_PREFIX_VRADH: ${{ env.R2_PREFIX_VRADH }}
        run: |
          set -euo pipefail

          upload_one() {
            local f="$1"; local ct="$2"; local dest="$3"
            local attempt=1
            while [ "$attempt" -le 3 ]; do
              echo "Pujant ($attempt/3): $dest"
              if npx wrangler r2 object put "$dest" --file="$f" --remote --content-type="$ct"; then
                return 0
              fi
              attempt=$((attempt + 1))
              sleep 3
            done
            return 1
          }

          delete_one() {
            local dest="$1"
            local attempt=1
            while [ "$attempt" -le 3 ]; do
              if npx wrangler r2 object delete "$dest" --remote; then
                return 0
              fi
              attempt=$((attempt + 1))
              sleep 3
            done
            return 0
          }

          fail_count=0

          upload_dir_recursive() {
            local src_dir="$1"
            local r2_prefix="$2"
            if [ ! -d "$src_dir" ]; then
              echo "AVIS: no existeix $src_dir, salto"
              return
            fi
            cd "$src_dir"
            # Subdirectoris per radar (esgld, espdg, ...)
            for sub in */; do
              [ -d "$sub" ] || continue
              sub_name="${sub%/}"
              echo "→ radar $sub_name"
              for f in "$sub_name"/*.png; do
                [ -f "$f" ] || continue
                base=$(basename "$f")
                upload_one "$f" "image/png" "${R2_BUCKET}/${r2_prefix}${sub_name}/${base}" || fail_count=$((fail_count + 1))
              done
            done
            if [ -f manifest.json ]; then
              upload_one "manifest.json" "application/json" "${R2_BUCKET}/${r2_prefix}manifest.json" || fail_count=$((fail_count + 1))
            fi
            cd - > /dev/null
          }

          upload_dir_recursive "dades_png/dades_radar_dbz" "$R2_PREFIX_DBZ"
          upload_dir_recursive "dades_png/dades_radar_vradh" "$R2_PREFIX_VRADH"

          if [ "$fail_count" -gt 0 ]; then
            echo "::error::$fail_count fitxers no s'han pogut pujar"
            exit 1
          fi
          echo "OK: dades pujades a R2."