name: Actualitza dades radar

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  R2_BUCKET: tempestes-radar-data
  R2_PREFIX: radar/

jobs:
  # Job 1: Preparar l'entorn i baixar dades existents
  preparar-entorn:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: radar-update
      cancel-in-progress: true
    
    outputs:
      cache-key: ${{ steps.set-cache-key.outputs.cache-key }}
    
    steps:
      - name: Clonar repositori
        uses: actions/checkout@v4

      - name: Crear carpetes de dades
        run: |
          mkdir -p radar/public/radar

      - name: Generar clau de cache
        id: set-cache-key
        run: echo "cache-key=radar-data-$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT

      - name: Baixar estat actual de R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd radar/public/radar

          echo "Llistant objectes existents a R2 (prefix: ${R2_PREFIX})..."
          HTTP_CODE=$(curl -s -o /tmp/r2-list.json -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${R2_BUCKET}/objects?prefix=${R2_PREFIX}&per_page=1000" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "avis: llistat ha fallat (HTTP $HTTP_CODE), es tracta com a bucket buit"
            cat /tmp/r2-list.json 2>/dev/null || true
            KEYS=""
          else
            SUCCESS=$(jq -r '.success' /tmp/r2-list.json)
            if [ "$SUCCESS" != "true" ]; then
              echo "avis: l'API ha respost success=false, es tracta com a bucket buit"
              jq -c '.errors' /tmp/r2-list.json 2>/dev/null || true
              KEYS=""
            else
              KEYS=$(jq -r '.result[]?.key // empty' /tmp/r2-list.json)
            fi
          fi

          if [ -z "$KEYS" ]; then
            echo "Bucket buit o sense objectes amb aquest prefix"
          else
            echo "$KEYS" | while IFS= read -r key; do
              [ -z "$key" ] && continue
              nom_fitxer="${key#${R2_PREFIX}}"
              [ -z "$nom_fitxer" ] && continue
              echo "  baixant $key -> $nom_fitxer"
              npx wrangler r2 object get "${R2_BUCKET}/${key}" \
                --remote --file="$nom_fitxer" \
                || echo "    avis: no s'ha pogut baixar $key"
            done
          fi

          echo "--- Contingut baixat de R2 ---"
          ls -la . 2>/dev/null || echo "buit"

      - name: Cachejar dades
        uses: actions/cache/save@v4
        with:
          path: radar/public/radar
          key: ${{ steps.set-cache-key.outputs.cache-key }}

  # Job 2: Executar radar.py
  executar-radar:
    needs: preparar-entorn
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: radar-update
      cancel-in-progress: true
    
    outputs:
      cache-key: ${{ needs.preparar-entorn.outputs.cache-key }}
    
    steps:
      - name: Clonar repositori
        uses: actions/checkout@v4

      - name: Recuperar dades cacheadas
        uses: actions/cache/restore@v4
        with:
          path: radar/public/radar
          key: ${{ needs.preparar-entorn.outputs.cache-key }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instal·lar dependències del sistema (HDF5)
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev

      - name: Instal·lar dependències de Python
        run: |
          python -m pip install --upgrade pip
          pip install requests h5py numpy pyproj

      - name: Executar radar.py
        env:
          METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          cd radar
          python -u radar.py

      - name: Mostrar contingut generat
        run: |
          echo "--- public/radar (despres d'executar radar.py) ---"
          ls -la radar/public/radar/ 2>/dev/null || echo "buit"

      - name: Cachejar resultats
        uses: actions/cache/save@v4
        with:
          path: radar/public/radar
          key: ${{ needs.preparar-entorn.outputs.cache-key }}-processed

  # Job 3: Pujar dades a R2 (paral·lelitzat en 3 sub-jobs)
  pujar-js:
    needs: executar-radar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: radar-update
      cancel-in-progress: true
    
    steps:
      - name: Recuperar resultats
        uses: actions/cache/restore@v4
        with:
          path: radar/public/radar
          key: ${{ needs.executar-radar.outputs.cache-key }}-processed

      - name: Pujar fitxers JS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd radar/public/radar
          for f in *.js; do
            [ -e "$f" ] || continue
            echo "Pujant $f..."
            npx wrangler r2 object put "${R2_BUCKET}/${R2_PREFIX}$f" \
              --file="$f" --remote --content-type="application/javascript"
          done

  pujar-json-grup1:
    needs: executar-radar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: radar-update
      cancel-in-progress: true
    
    steps:
      - name: Recuperar resultats
        uses: actions/cache/restore@v4
        with:
          path: radar/public/radar
          key: ${{ needs.executar-radar.outputs.cache-key }}-processed

      - name: Pujar JSON grup 1 (A-M)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd radar/public/radar
          for f in [a-mA-M]*.json; do
            [ -e "$f" ] || continue
            echo "Pujant $f..."
            npx wrangler r2 object put "${R2_BUCKET}/${R2_PREFIX}$f" \
              --file="$f" --remote --content-type="application/json"
          done

  pujar-json-grup2:
    needs: executar-radar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: radar-update
      cancel-in-progress: true
    
    steps:
      - name: Recuperar resultats
        uses: actions/cache/restore@v4
        with:
          path: radar/public/radar
          key: ${{ needs.executar-radar.outputs.cache-key }}-processed

      - name: Pujar JSON grup 2 (N-Z i altres)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd radar/public/radar
          for f in [n-zN-Z]*.json [0-9]*.json; do
            [ -e "$f" ] || continue
            echo "Pujant $f..."
            npx wrangler r2 object put "${R2_BUCKET}/${R2_PREFIX}$f" \
              --file="$f" --remote --content-type="application/json"
          done
