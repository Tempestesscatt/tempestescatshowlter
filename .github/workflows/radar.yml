name: Actualitza dades radar

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  R2_BUCKET: tempestes-radar-data
  R2_PREFIX: radar/

jobs:
  preparar-entorn:
    runs-on: ubuntu-latest
    concurrency:
      group: radar-update
      cancel-in-progress: true
    
    steps:
      - name: Clonar repositori
        uses: actions/checkout@v4

      - name: Crear carpetes de dades
        run: mkdir -p radar/public/radar

      - name: Baixar dades del dia actual de R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd radar/public/radar
          
          # Obtenir data d'avui en format DD_MM_YYYY
          AVUI=$(date -u +"%d_%m_%Y")
          
          echo "📅 Data d'avui: $AVUI"
          echo "📥 Descarregant fitxers essencials i frames del dia..."
          
          # 1. Sempre descarregar fitxers d'estat
          for f in nimbus_daily_state.json radar_daily_nimbus.js radar_metadata.js status.js; do
            echo "  ⬇️ $f"
            npx wrangler r2 object get "${R2_BUCKET}/${R2_PREFIX}$f" \
              --remote --file="$f" 2>/dev/null || echo "    ℹ️ $f no existeix"
          done
          
          # 2. Llistar i descarregar NOMÉS frames del dia actual
          echo "  🔍 Buscant frames del dia $AVUI..."
          HTTP_CODE=$(curl -s -o /tmp/r2-list.json -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${R2_BUCKET}/objects?prefix=${R2_PREFIX}radar_frame_${AVUI}&per_page=1000" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          
          if [ "$HTTP_CODE" = "200" ]; then
            SUCCESS=$(jq -r '.success' /tmp/r2-list.json)
            if [ "$SUCCESS" = "true" ]; then
              # Descarregar en paral·lel (5 simultanis)
              DESCARGAR_FRAME() {
                key="$1"
                nom="${key#${R2_PREFIX}}"
                echo "  ⬇️ $nom"
                npx wrangler r2 object get "${R2_BUCKET}/${key}" \
                  --remote --file="$nom" 2>/dev/null && return 0
                return 1
              }
              
              count=0
              jq -r '.result[]?.key // empty' /tmp/r2-list.json | while IFS= read -r key; do
                [ -z "$key" ] && continue
                DESCARGAR_FRAME "$key" &
                count=$((count + 1))
                if [ $((count % 5)) -eq 0 ]; then
                  wait
                fi
              done
              wait
            fi
          fi
          
          echo "--- Contingut descarregat ---"
          ls -lh . 2>/dev/null || echo "buit"
          echo "Total fitxers: $(ls -1 | wc -l)"
          echo "Fitxers no buits: $(find . -type f -not -empty | wc -l)"

      - name: Verificar que hi ha dades
        run: |
          cd radar/public/radar
          FITXERS_BUIDES=$(find . -type f -empty | wc -l)
          if [ $FITXERS_BUIDES -gt 0 ]; then
            echo "⚠️ Hi ha $FITXERS_BUIDES fitxers buits:"
            find . -type f -empty -exec ls -lh {} \;
          fi

      - name: Pujar artefacte amb dades existents
        uses: actions/upload-artifact@v4
        with:
          name: dades-existents
          path: radar/public/radar/
          retention-days: 1

  executar-radar:
    needs: preparar-entorn
    runs-on: ubuntu-latest
    concurrency:
      group: radar-update
      cancel-in-progress: true
    
    steps:
      - name: Clonar repositori
        uses: actions/checkout@v4

      - name: Crear carpetes de dades
        run: mkdir -p radar/public/radar

      - name: Descarregar dades existents
        uses: actions/download-artifact@v4
        with:
          name: dades-existents
          path: radar/public/radar/

      - name: Mostrar dades rebudes
        run: |
          cd radar/public/radar
          echo "📊 Dades rebudes:"
          ls -lh
          echo "Fitxers buits: $(find . -type f -empty | wc -l)"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instal·lar dependències del sistema (HDF5)
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev

      - name: Instal·lar dependències de Python
        run: |
          python -m pip install --upgrade pip
          pip install requests h5py numpy pyproj

      - name: Executar radar.py (CIRRUS / dBZ + NIMBUS / mm)
        env:
          METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          cd radar
          python -u radar.py

      - name: Mostrar contingut generat
        run: |
          echo "--- public/radar (després d'executar radar.py) ---"
          cd radar/public/radar
          ls -lh
          echo "Total fitxers: $(ls -1 | wc -l)"

      - name: Pujar artefacte amb resultats processats
        uses: actions/upload-artifact@v4
        with:
          name: dades-processades
          path: radar/public/radar/
          retention-days: 1

  pujar-a-r2:
    needs: executar-radar
    runs-on: ubuntu-latest
    concurrency:
      group: radar-update
      cancel-in-progress: true
    
    steps:
      - name: Descarregar resultats processats
        uses: actions/download-artifact@v4
        with:
          name: dades-processades
          path: radar/public/radar/

      - name: Pujar tots els fitxers a R2 (paral·lel)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd radar/public/radar
          
          echo "📤 Pujant tots els fitxers a R2 en paral·lel (5 simultanis)..."
          
          PUJAR() {
            fitxer="$1"
            # Determinar content-type
            case "$fitxer" in
              *.json) ct="application/json" ;;
              *.js) ct="application/javascript" ;;
              *) ct="application/octet-stream" ;;
            esac
            
            # Només pujar si no està buit
            if [ -s "$fitxer" ]; then
              echo "  ⬆️ $fitxer"
              npx wrangler r2 object put "${R2_BUCKET}/${R2_PREFIX}${fitxer}" \
                --file="$fitxer" --remote --content-type="$ct" 2>&1 | grep -E "(⬆️|Error|error)" || true
            else
              echo "  ⚠️ $fitxer està buit, no es puja"
            fi
          }
          
          count=0
          for f in *.js *.json; do
            [ -e "$f" ] || continue
            PUJAR "$f" &
            count=$((count + 1))
            # Limitar a 5 pujades simultànies
            if [ $((count % 5)) -eq 0 ]; then
              wait
              sleep 1
            fi
          done
          wait
          
          echo "✅ Pujada completada"
          echo "Fitxers pujats: $count"
