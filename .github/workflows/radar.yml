name: Descarga Radar PNG

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  R2_BUCKET: tempestes-radar-data
  R2_PREFIX: dades_radar/
  R2_PREFIX_NIMBUS: dades_radar_nimbus/
  DADES_PNG_DIR: scripts-privats/radar_out
  R2_PUBLIC_BASE: https://radar-data.tempestes.cat   # 👈 canvia-ho si cal

jobs:

  radar-png:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      files_ok: ${{ steps.verify.outputs.files_ok }}

    steps:

      - name: Clonar repositori (sense submòduls)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Configurar clau SSH per al submòdul privat
        env:
          DEPLOY_KEY_B64: ${{ secrets.SUBMODULE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$DEPLOY_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config --global core.sshCommand "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no"

      - name: Inicialitzar submòdul privat
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth=1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instal·lar dependències
        run: |
          set -euo pipefail
          pip install --quiet requests h5py numpy pillow pyproj
          pip check || true

      - name: Executar radar-real.py
        id: run_png
        env:
          METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
          R2_PUBLIC_BASE: ${{ env.R2_PUBLIC_BASE }}
          R2_PREFIX: ${{ env.R2_PREFIX }}
          R2_PREFIX_NIMBUS: ${{ env.R2_PREFIX_NIMBUS }}
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
        run: |
          python -X faulthandler scripts-privats/radar-real.py
        continue-on-error: true

      - name: Verificar manifest i PNGs (dBZ i NIMBUS)
        id: verify
        run: |
          set -euo pipefail
          ok=true
          n_total=0

          for sub in dbz lluvia; do
            dir="$DADES_PNG_DIR/$sub"

            if [ ! -d "$dir" ]; then
              echo "AVIS: no existeix $dir"
              continue
            fi

            if [ ! -s "$dir/manifest.json" ]; then
              echo "ERROR: falta $dir/manifest.json"
              ok=false
              continue
            fi

            n=$(find "$dir" -maxdepth 1 -name "*.png" | wc -l)
            n=$((n))
            echo "$sub: $n PNGs"
            n_total=$((n_total + n))
          done

          if [ "$ok" != "true" ] || [ "$n_total" -eq 0 ]; then
            echo "files_ok=false" >> "$GITHUB_OUTPUT"
            echo "ERROR: verificació fallida"
            exit 1
          fi

          echo "files_ok=true" >> "$GITHUB_OUTPUT"
          echo "OK: $n_total PNGs totals"

      - name: Marcar job com a fallit si no hi ha dades
        if: steps.verify.outputs.files_ok != 'true'
        run: |
          echo "::error::Cicle de radar PNG incomplet: no es publicarà a R2."
          exit 1

      - name: Pujar resultat com a artifact (temporal)
        if: steps.verify.outputs.files_ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dades-radar-png
          path: ${{ env.DADES_PNG_DIR }}/
          retention-days: 1
          if-no-files-found: error


  publicar:
    needs: radar-png
    if: needs.radar-png.outputs.files_ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    concurrency:
      group: radar-png-update
      cancel-in-progress: false

    steps:

      - name: Descarregar artifact
        uses: actions/download-artifact@v4
        with:
          name: dades-radar-png
          path: dades_png/

      - name: Verificar altre cop abans de publicar
        run: |
          set -euo pipefail
          ok=true

          for sub in dbz lluvia; do
            dir="dades_png/$sub"
            [ -d "$dir" ] || continue

            if [ ! -s "$dir/manifest.json" ]; then
              echo "::error::Falta $dir/manifest.json"
              ok=false
            fi
          done

          [ "$ok" = "true" ] || exit 1
          echo "OK: verificació prèvia correcta"

      - name: Pujar a R2 (dBZ + NIMBUS)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          upload_one() {
            local f="$1"; local ct="$2"; local dest="$3"
            local attempt=1
            while [ "$attempt" -le 3 ]; do
              echo "Pujant ($attempt/3): $dest"
              if npx wrangler r2 object put "$dest" \
                   --file="$f" --remote --content-type="$ct"; then
                return 0
              fi
              attempt=$((attempt + 1))
              sleep 3
            done
            return 1
          }

          fail_count=0

          # --- DBZ ---
          if [ -d dades_png/dbz ]; then
            cd dades_png/dbz

            if [ -f .neteja ]; then
              echo "→ esborrant prefix $R2_PREFIX"
              npx wrangler r2 object delete --recursive \
                "$R2_BUCKET/$R2_PREFIX" --remote || true
              rm -f .neteja
            fi

            for f in *.png; do
              [ -f "$f" ] || continue
              upload_one "$f" "image/png" "${R2_BUCKET}/${R2_PREFIX}$f" \
                || fail_count=$((fail_count + 1))
            done

            if [ -f manifest.json ]; then
              upload_one "manifest.json" "application/json" \
                "${R2_BUCKET}/${R2_PREFIX}manifest.json" \
                || fail_count=$((fail_count + 1))
            fi

            cd ../..
          fi

          # --- NIMBUS ---
          if [ -d dades_png/lluvia ]; then
            cd dades_png/lluvia

            if [ -f .neteja ]; then
              echo "→ esborrant prefix $R2_PREFIX_NIMBUS"
              npx wrangler r2 object delete --recursive \
                "$R2_BUCKET/$R2_PREFIX_NIMBUS" --remote || true
              rm -f .neteja
            fi

            for f in *.png; do
              [ -f "$f" ] || continue
              upload_one "$f" "image/png" "${R2_BUCKET}/${R2_PREFIX_NIMBUS}$f" \
                || fail_count=$((fail_count + 1))
            done

            if [ -f manifest.json ]; then
              upload_one "manifest.json" "application/json" \
                "${R2_BUCKET}/${R2_PREFIX_NIMBUS}manifest.json" \
                || fail_count=$((fail_count + 1))
            fi

            cd ../..
          fi

          if [ "$fail_count" -gt 0 ]; then
            echo "::error::$fail_count fitxers no s'han pogut pujar"
            exit 1
          fi

          echo "OK: dBZ + NIMBUS pujats a R2."