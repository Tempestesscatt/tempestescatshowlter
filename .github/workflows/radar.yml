name: Descarga Radar PNG

on:
  workflow_dispatch: {}
  # Si vols execució periòdica, descomenta:
  # schedule:
  #   - cron: '*/5 * * * *'   # cada 5 min (dBZ)

permissions:
  contents: read

env:
  R2_BUCKET: tempestes-radar-data
  R2_PREFIX: dades_radar_dbz/
  R2_PREFIX_NIMBUS: dades_radar_nimbus/
  R2_PREFIX_ACUM: dades_radar_acumulacions/
  DADES_PNG_DIR: scripts-privats/radar_out
  DADES_ACUM_DIR: scripts-privats/radar_out_acum
  R2_PUBLIC_BASE: https://radar-data.tempestes.cat

jobs:

  # ============================================================
  # JOB 1: Radar PNG (dBZ + NIMBUS)
  # ============================================================
  radar-png:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      files_ok: ${{ steps.verify.outputs.files_ok }}

    steps:

      - name: Clonar repositori (sense submòduls)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Configurar clau SSH per al submòdul privat
        env:
          DEPLOY_KEY_B64: ${{ secrets.SUBMODULE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$DEPLOY_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config --global core.sshCommand "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no"

      - name: Inicialitzar submòdul privat
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth=1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instal·lar dependències
        run: |
          set -euo pipefail
          pip install --quiet requests h5py numpy pillow pyproj
          pip check || true

      - name: Executar radar-real.py
        env:
          METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
          RADAR_SECRET_KEY: ${{ secrets.RADAR_SECRET_KEY }}        # 👈 AFEGIT
          R2_PUBLIC_BASE: ${{ env.R2_PUBLIC_BASE }}
          R2_PREFIX: ${{ env.R2_PREFIX }}
          R2_PREFIX_NIMBUS: ${{ env.R2_PREFIX_NIMBUS }}
          RADAR_FINESTRA_HORES: '24'                                 # 👈 opcional
          RADAR_RECUPERA_SLOTS: '36'                                 # 👈 opcional
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
        run: python -X faulthandler scripts-privats/radar-real.py
        continue-on-error: true

      - name: Verificar manifest i PNGs
        id: verify
        run: |
          set -euo pipefail
          ok=true
          n_total=0

          declare -A SUBS=(
            ["dbz"]="dades_radar_dbz"
            ["lluvia"]="dades_radar_nimbus"
          )

          for sub in "${!SUBS[@]}"; do
            dir="$DADES_PNG_DIR/${SUBS[$sub]}"
            echo "--- Comprovant $sub ($dir) ---"

            if [ ! -d "$dir" ]; then
              echo "AVIS: no existeix $dir"
              ok=false
              continue
            fi

            if [ ! -s "$dir/manifest.json" ]; then
              echo "ERROR: falta $dir/manifest.json"
              ok=false
              continue
            fi

            n=$(find "$dir" -maxdepth 1 -name "*.png" | wc -l)
            n=$((n))
            echo "$sub: $n PNGs"
            n_total=$((n_total + n))
          done

          echo "Total PNGs: $n_total"

          if [ "$ok" != "true" ] || [ "$n_total" -eq 0 ]; then
            echo "files_ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "files_ok=true" >> "$GITHUB_OUTPUT"

      - name: Pujar artifact radar-png
        if: steps.verify.outputs.files_ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dades-radar-png
          path: ${{ env.DADES_PNG_DIR }}/
          retention-days: 1
          if-no-files-found: error


  # ============================================================
  # JOB 2: Acumulacions (en paral·lel amb radar-png)
  # ============================================================
  acumulacions:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      files_ok: ${{ steps.verify.outputs.files_ok }}

    steps:

      - name: Clonar repositori (sense submòduls)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Configurar clau SSH per al submòdul privat
        env:
          DEPLOY_KEY_B64: ${{ secrets.SUBMODULE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$DEPLOY_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config --global core.sshCommand "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no"

      - name: Inicialitzar submòdul privat
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth=1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instal·lar dependències
        run: |
          set -euo pipefail
          pip install --quiet requests numpy pillow
          pip check || true

      - name: Executar cumul.py
        env:
          RADAR_SECRET_KEY: ${{ secrets.RADAR_SECRET_KEY }}        # 👈 AFEGIT
          R2_PUBLIC_BASE: ${{ env.R2_PUBLIC_BASE }}
          R2_PREFIX_NIMBUS: ${{ env.R2_PREFIX_NIMBUS }}
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
        run: python -X faulthandler scripts-privats/cumul.py
        continue-on-error: true

      - name: Verificar acumulacions
        id: verify
        run: |
          set -euo pipefail

          if [ ! -d "$DADES_ACUM_DIR" ]; then
            echo "AVIS: no existeix $DADES_ACUM_DIR"
            echo "files_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ ! -s "$DADES_ACUM_DIR/manifest.json" ]; then
            echo "AVIS: no s'ha generat manifest.json"
            echo "files_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          n=$(find "$DADES_ACUM_DIR" -maxdepth 1 -name "*.png" | wc -l)
          n=$((n))
          echo "Acumulacions: $n PNGs"

          if [ "$n" -eq 0 ]; then
            echo "files_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "files_ok=true" >> "$GITHUB_OUTPUT"
          echo "OK: $n PNGs d'acumulacions"

      - name: Pujar artifact acumulacions
        if: steps.verify.outputs.files_ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dades-acumulacions
          path: ${{ env.DADES_ACUM_DIR }}/
          retention-days: 1
          if-no-files-found: warn                              # 👈 canviat de error


  # ============================================================
  # JOB 3: Publicar a R2
  # ============================================================
  publicar:
    needs: [radar-png, acumulacions]
    if: |
      always() &&
      needs.radar-png.outputs.files_ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    concurrency:
      group: radar-png-update
      cancel-in-progress: false

    steps:

      - name: Descarregar artifact radar-png
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: dades-radar-png
          path: dades_png/

      - name: Descarregar artifact acumulacions (si existeix)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: dades-acumulacions
          path: dades_acum/

      - name: Verificar què tenim
        id: check
        run: |
          set -euo pipefail

          echo "=== radar-png ==="
          ls -la dades_png/ || echo "no existeix"

          ok_radar=false
          for sub in dades_radar_dbz dades_radar_nimbus; do
            if [ -d "dades_png/$sub" ] && [ -s "dades_png/$sub/manifest.json" ]; then
              n=$(find "dades_png/$sub" -maxdepth 1 -name "*.png" | wc -l)
              echo "  $sub: $n PNGs"
              ok_radar=true
            fi
          done

          echo "=== acumulacions ==="
          ls -la dades_acum/ || echo "no existeix"

          ok_acum=false
          if [ -d "dades_acum" ] && [ -s "dades_acum/manifest.json" ]; then
            n=$(find "dades_acum" -maxdepth 1 -name "*.png" | wc -l)
            echo "  acumulacions: $n PNGs"
            if [ "$n" -gt 0 ]; then
              ok_acum=true
            fi
          fi

          echo "radar_ok=$ok_radar" >> "$GITHUB_OUTPUT"
          echo "acum_ok=$ok_acum" >> "$GITHUB_OUTPUT"

          if [ "$ok_radar" != "true" ]; then
            echo "::error::No hi ha dades de radar per publicar"
            exit 1
          fi

      - name: Pujar a R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ env.R2_BUCKET }}                        # 👈 AFEGIT (per si de cas)
          R2_PREFIX: ${{ env.R2_PREFIX }}                        # 👈 AFEGIT
          R2_PREFIX_NIMBUS: ${{ env.R2_PREFIX_NIMBUS }}          # 👈 AFEGIT
          R2_PREFIX_ACUM: ${{ env.R2_PREFIX_ACUM }}              # 👈 AFEGIT
        run: |
          set -euo pipefail

          upload_one() {
            local f="$1"; local ct="$2"; local dest="$3"
            local attempt=1
            while [ "$attempt" -le 3 ]; do
              echo "Pujant ($attempt/3): $dest"
              if npx wrangler r2 object put "$dest" \
                   --file="$f" --remote --content-type="$ct"; then
                return 0
              fi
              attempt=$((attempt + 1))
              sleep 3
            done
            return 1
          }

          delete_one() {
            local dest="$1"
            local attempt=1
            while [ "$attempt" -le 3 ]; do
              echo "Esborrant ($attempt/3): $dest"
              if npx wrangler r2 object delete "$dest" --remote; then
                return 0
              fi
              attempt=$((attempt + 1))
              sleep 3
            done
            echo "AVIS: no s'ha pogut esborrar $dest"
            return 0   # no bloquegem la publicació per un esborrat fallit
          }

          fail_count=0

          upload_dir() {
            local src_dir="$1"
            local r2_prefix="$2"

            if [ ! -d "$src_dir" ]; then
              echo "AVIS: no existeix $src_dir, salto"
              return
            fi

            cd "$src_dir"

            # 👇 NOVA GESTIÓ: esborrar els PNG que ja no són al manifest
            if [ -f .esborrar.txt ]; then
              echo "→ esborrant $(wc -l < .esborrar.txt) fitxers antics de $r2_prefix"
              while IFS= read -r nom; do
                [ -z "$nom" ] && continue
                delete_one "$R2_BUCKET/${r2_prefix}${nom}"
              done < .esborrar.txt
              rm -f .esborrar.txt
            fi

            if [ -f .neteja ]; then
              echo "→ esborrant prefix $r2_prefix"
              npx wrangler r2 object delete --recursive \
                "$R2_BUCKET/$r2_prefix" --remote || true
              rm -f .neteja
            fi

            for f in *.png; do
              [ -f "$f" ] || continue
              upload_one "$f" "image/png" "${R2_BUCKET}/${r2_prefix}$f" \
                || fail_count=$((fail_count + 1))
            done

            if [ -f manifest.json ]; then
              upload_one "manifest.json" "application/json" \
                "${R2_BUCKET}/${r2_prefix}manifest.json" \
                || fail_count=$((fail_count + 1))
            fi

            cd - > /dev/null
          }

          # Sempre pugem dBZ i NIMBUS (obligatoris)
          upload_dir "dades_png/dades_radar_dbz" "$R2_PREFIX"
          upload_dir "dades_png/dades_radar_nimbus" "$R2_PREFIX_NIMBUS"

          # Acumulacions: només si existeixen (opcionals)
          if [ -d "dades_acum" ] && [ -s "dades_acum/manifest.json" ]; then
            upload_dir "dades_acum" "$R2_PREFIX_ACUM"
          else
            echo "AVIS: no hi ha acumulacions per publicar (es salta)"
          fi

          if [ "$fail_count" -gt 0 ]; then
            echo "::error::$fail_count fitxers no s'han pogut pujar"
            exit 1
          fi

          echo "OK: dades pujades a R2."