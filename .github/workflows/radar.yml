name: Actualitza dades radar

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  R2_BUCKET: tempestes-radar-data
  R2_PREFIX: radar/

jobs:
  actualitzar-dades:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: radar-update
      cancel-in-progress: true

    steps:
      - name: Clonar repositori
        uses: actions/checkout@v4

      - name: Crear carpetes de dades
        run: |
          mkdir -p radar/public/radar

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instal·lar dependències del sistema (HDF5)
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev

      - name: Instal·lar dependències de Python
        run: |
          python -m pip install --upgrade pip
          pip install requests h5py numpy pyproj

      # ─────────────────────────────────────────────────────────────
      # Esborrem a R2 tots els radar_frame_*.js de dies ANTERIORS
      # a avui (UTC). Els d'avui es deixen intactes perquè radar.py
      # els segueixi acumulant. nimbus_daily_state.json i
      # radar_daily_nimbus.js no porten data al nom i queden fora
      # del patró, així que no es toquen.
      # ─────────────────────────────────────────────────────────────
      - name: Esborrar frames de dies anteriors a R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          AVUI=$(date -u +%d_%m_%Y)
          echo "Data d'avui (UTC): ${AVUI}"

          echo "Llistant objectes existents a R2 (prefix: ${R2_PREFIX})..."
          HTTP_CODE=$(curl -s -o /tmp/r2-list.json -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${R2_BUCKET}/objects?prefix=${R2_PREFIX}&per_page=1000" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "avis: llistat ha fallat (HTTP $HTTP_CODE), es continua sense esborrar res"
            cat /tmp/r2-list.json 2>/dev/null || true
          else
            SUCCESS=$(jq -r '.success' /tmp/r2-list.json)
            if [ "$SUCCESS" != "true" ]; then
              echo "avis: l'API ha respost success=false, es continua sense esborrar res"
              jq -c '.errors' /tmp/r2-list.json 2>/dev/null || true
            else
              # Només fitxers "radar_frame_DD_MM_YYYY_HHMMZ.js" la data dels quals NO sigui avui.
              KEYS_JSON=$(jq -c --arg avui "$AVUI" '
                [.result[]?.key // empty
                 | select(test("radar_frame_\\d{2}_\\d{2}_\\d{4}_\\d{4}Z\\.js$"))
                 | select(test("radar_frame_" + $avui + "_") | not)]
              ' /tmp/r2-list.json)

              COUNT=$(echo "$KEYS_JSON" | jq 'length')
              echo "Frames de dies anteriors a esborrar: $COUNT"

              if [ "$COUNT" -gt 0 ]; then
                echo "$KEYS_JSON" | jq -r '.[]'

                DEL_HTTP_CODE=$(curl -s -o /tmp/r2-delete.json -w "%{http_code}" \
                  -X DELETE \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${R2_BUCKET}/objects" \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H "Content-Type: application/json" \
                  --data "{\"keys\": ${KEYS_JSON}}")

                echo "HTTP esborrat: $DEL_HTTP_CODE"
                cat /tmp/r2-delete.json
              else
                echo "Res a esborrar."
              fi
            fi
          fi

      # ─────────────────────────────────────────────────────────────
      # Baixem el que queda a R2 (nomes els frames d'avui + estat)
      # perque radar.py pugui continuar acumulant frames del dia.
      # ─────────────────────────────────────────────────────────────
      - name: Baixar estat actual de R2 (nomes frames d'avui)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd radar/public/radar

          echo "Llistant objectes existents a R2 (prefix: ${R2_PREFIX})..."
          HTTP_CODE=$(curl -s -o /tmp/r2-list2.json -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${R2_BUCKET}/objects?prefix=${R2_PREFIX}&per_page=1000" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "avis: llistat ha fallat (HTTP $HTTP_CODE), es tracta com a bucket buit"
            cat /tmp/r2-list2.json 2>/dev/null || true
            KEYS=""
          else
            SUCCESS=$(jq -r '.success' /tmp/r2-list2.json)
            if [ "$SUCCESS" != "true" ]; then
              echo "avis: l'API ha respost success=false, es tracta com a bucket buit"
              jq -c '.errors' /tmp/r2-list2.json 2>/dev/null || true
              KEYS=""
            else
              KEYS=$(jq -r '.result[]?.key // empty' /tmp/r2-list2.json)
            fi
          fi

          if [ -z "$KEYS" ]; then
            echo "Bucket buit o sense objectes amb aquest prefix (o llistat no disponible)"
          else
            echo "$KEYS" | while IFS= read -r key; do
              [ -z "$key" ] && continue
              nom_fitxer="${key#${R2_PREFIX}}"
              [ -z "$nom_fitxer" ] && continue
              echo "  baixant $key -> $nom_fitxer"
              npx wrangler r2 object get "${R2_BUCKET}/${key}" \
                --remote --file="$nom_fitxer" \
                || echo "    avis: no s'ha pogut baixar $key (es continua igualment)"
            done
          fi

          echo "--- Contingut baixat de R2 ---"
          ls -la . 2>/dev/null || echo "buit"

      - name: Executar radar.py (CIRRUS / dBZ + NIMBUS / mm)
        env:
          METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          cd radar
          python -u radar.py

      - name: Mostrar contingut generat
        run: |
          echo "--- public/radar (despres d'executar radar.py) ---"
          ls -la radar/public/radar/ 2>/dev/null || echo "buit"

      - name: Pujar dades a R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for f in radar/public/radar/*.js radar/public/radar/*.json; do
            [ -e "$f" ] || continue
            nom="$(basename "$f")"
            case "$nom" in
              *.json) content_type="application/json" ;;
              *) content_type="application/javascript" ;;
            esac
            npx wrangler r2 object put "${R2_BUCKET}/${R2_PREFIX}${nom}" \
              --file="$f" --remote --content-type="$content_type"
          done
