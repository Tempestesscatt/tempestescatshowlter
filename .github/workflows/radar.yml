name: Actualitza dades radar

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  R2_BUCKET: tempestes-radar-data
  R2_PREFIX: radar/

jobs:
  preparar-entorn:
    runs-on: ubuntu-latest
    concurrency:
      group: radar-update
      cancel-in-progress: true
    
    steps:
      - name: Clonar repositori
        uses: actions/checkout@v4

      - name: Crear carpetes de dades
        run: mkdir -p radar/public/radar

      - name: Baixar només fitxers essencials de R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd radar/public/radar

          # Només necessitem descarregar:
          # 1. nimbus_daily_state.json (estat diari)
          # 2. radar_daily_nimbus.js (dades diàries)
          # 3. Els últims 6 frames (1 hora) per evitar duplicats
          
          echo "📥 Descarregant fitxers essencials..."
          
          # Fitxers d'estat (sempre necessaris)
          for f in nimbus_daily_state.json radar_daily_nimbus.js; do
            echo "  ⬇️ $f"
            npx wrangler r2 object get "${R2_BUCKET}/${R2_PREFIX}$f" \
              --remote --file="$f" 2>/dev/null || echo "    ℹ️ $f no existeix (primera execució)"
          done
          
          # Només els últims 12 frames (2 hores) per evitar processar duplicats
          # Calculem els timestamps dels últims 120 minuts
          for i in $(seq 0 10 110); do
            timestamp=$(date -u -d "$i minutes ago" +"%d_%m_%Y_%H%MZ")
            fitxer="radar_frame_${timestamp}.js"
            if [ ! -f "$fitxer" ]; then
              npx wrangler r2 object get "${R2_BUCKET}/${R2_PREFIX}$fitxer" \
                --remote --file="$fitxer" 2>/dev/null || true
            fi
          done
          
          echo "--- Contingut descarregat ---"
          ls -la . 2>/dev/null || echo "buit"
          echo "Total fitxers: $(ls -1 | wc -l)"

      - name: Pujar artefacte amb dades existents
        uses: actions/upload-artifact@v4
        with:
          name: dades-existents
          path: radar/public/radar/
          retention-days: 1

  executar-radar:
    needs: preparar-entorn
    runs-on: ubuntu-latest
    concurrency:
      group: radar-update
      cancel-in-progress: true
    
    steps:
      - name: Clonar repositori
        uses: actions/checkout@v4

      - name: Crear carpetes de dades
        run: mkdir -p radar/public/radar

      - name: Descarregar dades existents
        uses: actions/download-artifact@v4
        with:
          name: dades-existents
          path: radar/public/radar/

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instal·lar dependències del sistema (HDF5)
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev

      - name: Instal·lar dependències de Python
        run: |
          python -m pip install --upgrade pip
          pip install requests h5py numpy pyproj

      - name: Executar radar.py (CIRRUS / dBZ + NIMBUS / mm)
        env:
          METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          cd radar
          python -u radar.py

      - name: Mostrar contingut generat
        run: |
          echo "--- public/radar (després d'executar radar.py) ---"
          ls -la radar/public/radar/ 2>/dev/null || echo "buit"
          echo "Total fitxers generats: $(ls -1 radar/public/radar/ | wc -l)"

      - name: Pujar artefacte amb resultats processats
        uses: actions/upload-artifact@v4
        with:
          name: dades-processades
          path: radar/public/radar/
          retention-days: 1

  pujar-js:
    needs: executar-radar
    runs-on: ubuntu-latest
    concurrency:
      group: radar-update
      cancel-in-progress: true
    
    steps:
      - name: Descarregar resultats processats
        uses: actions/download-artifact@v4
        with:
          name: dades-processades
          path: radar/public/radar/

      - name: Pujar fitxers JavaScript en paral·lel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd radar/public/radar
          echo "📤 Pujant fitxers JS en paral·lel..."
          
          # Funció per pujar en background
          pujar_fitxer() {
            echo "  ⬆️ $1"
            npx wrangler r2 object put "${R2_BUCKET}/${R2_PREFIX}$1" \
              --file="$1" --remote --content-type="application/javascript" 2>&1 | grep -v "^$"
          }
          
          # Pujar en paral·lel (màxim 10 simultanis)
          count=0
          for f in *.js; do
            [ -e "$f" ] || continue
            pujar_fitxer "$f" &
            count=$((count + 1))
            
            # Limitar a 10 pujades simultànies
            if [ $((count % 10)) -eq 0 ]; then
              wait
            fi
          done
          wait
          echo "✅ Tots els fitxers JS pujats"

  pujar-json-grup1:
    needs: executar-radar
    runs-on: ubuntu-latest
    concurrency:
      group: radar-update
      cancel-in-progress: true
    
    steps:
      - name: Descarregar resultats processats
        uses: actions/download-artifact@v4
        with:
          name: dades-processades
          path: radar/public/radar/

      - name: Pujar JSON grup 1 (A-M) en paral·lel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd radar/public/radar
          echo "📤 Pujant JSON grup 1 (A-M)..."
          
          pujar_fitxer() {
            echo "  ⬆️ $1"
            npx wrangler r2 object put "${R2_BUCKET}/${R2_PREFIX}$1" \
              --file="$1" --remote --content-type="application/json" 2>&1 | grep -v "^$"
          }
          
          count=0
          for f in [a-mA-M]*.json; do
            [ -e "$f" ] || continue
            pujar_fitxer "$f" &
            count=$((count + 1))
            if [ $((count % 10)) -eq 0 ]; then
              wait
            fi
          done
          wait
          echo "✅ JSON grup 1 pujats"

  pujar-json-grup2:
    needs: executar-radar
    runs-on: ubuntu-latest
    concurrency:
      group: radar-update
      cancel-in-progress: true
    
    steps:
      - name: Descarregar resultats processats
        uses: actions/download-artifact@v4
        with:
          name: dades-processades
          path: radar/public/radar/

      - name: Pujar JSON grup 2 (N-Z i numèrics) en paral·lel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd radar/public/radar
          echo "📤 Pujant JSON grup 2 (N-Z i numèrics)..."
          
          pujar_fitxer() {
            echo "  ⬆️ $1"
            npx wrangler r2 object put "${R2_BUCKET}/${R2_PREFIX}$1" \
              --file="$1" --remote --content-type="application/json" 2>&1 | grep -v "^$"
          }
          
          count=0
          for f in [n-zN-Z]*.json [0-9]*.json; do
            [ -e "$f" ] || continue
            pujar_fitxer "$f" &
            count=$((count + 1))
            if [ $((count % 10)) -eq 0 ]; then
              wait
            fi
          done
          wait
          echo "✅ JSON grup 2 pujats"
