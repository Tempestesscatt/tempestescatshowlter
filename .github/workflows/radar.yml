name: Descarga Radar PNG

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  R2_BUCKET: tempestes-radar-data
  R2_PREFIX: dades_radar/
  R2_PREFIX_NIMBUS: dades_radar_nimbus/
  R2_PREFIX_ACUM: dades_radar_acumulacions/
  DADES_PNG_DIR: scripts-privats/radar_out
  DADES_ACUM_DIR: scripts-privats/radar_out_acum
  R2_PUBLIC_BASE: https://radar-data.tempestes.cat   # 👈 canvia-ho si cal

jobs:

  # ============================================================
  # JOB 1: Radar PNG (dBZ + NIMBUS)
  # ============================================================
  radar-png:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      files_ok: ${{ steps.verify.outputs.files_ok }}

    steps:

      - name: Clonar repositori (sense submòduls)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Configurar clau SSH per al submòdul privat
        env:
          DEPLOY_KEY_B64: ${{ secrets.SUBMODULE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$DEPLOY_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config --global core.sshCommand "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no"

      - name: Inicialitzar submòdul privat
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth=1

      - name: DEBUG submòdul (comprovació)
        run: |
          echo "=== Fitxers a scripts-privats ==="
          ls -la scripts-privats/ || echo "no existeix"
          echo ""
          echo "=== Commit del submòdul ==="
          cd scripts-privats && git log --oneline -1 || true
          cd ..
          echo ""
          echo "=== Grep processar_producte a radar-real.py ==="
          grep -n "processar_producte" scripts-privats/radar-real.py || echo "NO TROBAT"
          echo ""
          echo "=== Grep mkdir a manifest_utils.py ==="
          grep -n "mkdir" scripts-privats/manifest_utils.py || echo "NO TROBAT"
          echo ""
          echo "=== Grep cumul.py existeix? ==="
          ls -la scripts-privats/cumul.py || echo "NO EXISTEIX"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instal·lar dependències
        run: |
          set -euo pipefail
          pip install --quiet requests h5py numpy pillow pyproj
          pip check || true

      - name: Executar radar-real.py
        id: run_png
        env:
          METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
          R2_PUBLIC_BASE: ${{ env.R2_PUBLIC_BASE }}
          R2_PREFIX: ${{ env.R2_PREFIX }}
          R2_PREFIX_NIMBUS: ${{ env.R2_PREFIX_NIMBUS }}
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
        run: |
          python -X faulthandler scripts-privats/radar-real.py
        continue-on-error: true

      - name: Verificar manifest i PNGs
        id: verify
        run: |
          set -euo pipefail
          ok=true
          n_total=0

          for sub in dbz lluvia; do
            dir="$DADES_PNG_DIR/$sub"
            echo "--- Comprovant $sub ---"

            if [ ! -d "$dir" ]; then
              echo "AVIS: no existeix $dir"
              ok=false
              continue
            fi

            if [ ! -s "$dir/manifest.json" ]; then
              echo "ERROR: falta $dir/manifest.json"
              ok=false
              continue
            fi

            n=$(find "$dir" -maxdepth 1 -name "*.png" | wc -l)
            n=$((n))
            echo "$sub: $n PNGs"
            n_total=$((n_total + n))
          done

          echo "Total PNGs: $n_total"

          if [ "$ok" != "true" ] || [ "$n_total" -eq 0 ]; then
            echo "files_ok=false" >> "$GITHUB_OUTPUT"
            echo "ERROR: verificació fallida"
            exit 1
          fi

          echo "files_ok=true" >> "$GITHUB_OUTPUT"
          echo "OK: $n_total PNGs totals"

      - name: Marcar job com a fallit si no hi ha dades
        if: steps.verify.outputs.files_ok != 'true'
        run: |
          echo "::error::Cicle de radar PNG incomplet"
          exit 1

      - name: Pujar artifact radar-png
        if: steps.verify.outputs.files_ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dades-radar-png
          path: ${{ env.DADES_PNG_DIR }}/
          retention-days: 1
          if-no-files-found: error


  # ============================================================
  # JOB 2: Acumulacions (en paral·lel amb radar-png)
  # ============================================================
  acumulacions:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      files_ok: ${{ steps.verify.outputs.files_ok }}

    steps:

      - name: Clonar repositori (sense submòduls)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Configurar clau SSH per al submòdul privat
        env:
          DEPLOY_KEY_B64: ${{ secrets.SUBMODULE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$DEPLOY_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config --global core.sshCommand "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no"

      - name: Inicialitzar submòdul privat
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth=1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instal·lar dependències
        run: |
          set -euo pipefail
          pip install --quiet requests numpy pillow
          pip check || true

      - name: Executar cumul.py
        id: run_acum
        env:
          R2_PUBLIC_BASE: ${{ env.R2_PUBLIC_BASE }}
          R2_PREFIX_NIMBUS: ${{ env.R2_PREFIX_NIMBUS }}
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
        run: |
          python -X faulthandler scripts-privats/cumul.py
        continue-on-error: true

      - name: Verificar acumulacions
        id: verify
        run: |
          set -euo pipefail

          if [ ! -s "$DADES_ACUM_DIR/manifest.json" ]; then
            echo "files_ok=false" >> "$GITHUB_OUTPUT"
            echo "ERROR: no s'ha generat manifest.json"
            exit 1
          fi

          n=$(find "$DADES_ACUM_DIR" -maxdepth 1 -name "*.png" | wc -l)
          n=$((n))
          echo "Acumulacions: $n PNGs"

          if [ "$n" -eq 0 ]; then
            echo "files_ok=false" >> "$GITHUB_OUTPUT"
            echo "ERROR: cap PNG generat"
            exit 1
          fi

          echo "files_ok=true" >> "$GITHUB_OUTPUT"
          echo "OK: $n PNGs d'acumulacions"

      - name: Marcar job com a fallit si no hi ha dades
        if: steps.verify.outputs.files_ok != 'true'
        run: |
          echo "::error::Cicle d'acumulacions incomplet"
          exit 1

      - name: Pujar artifact acumulacions
        if: steps.verify.outputs.files_ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dades-acumulacions
          path: ${{ env.DADES_ACUM_DIR }}/
          retention-days: 1
          if-no-files-found: error


  # ============================================================
  # JOB 3: Publicar a R2 (espera els 2 jobs anteriors)
  # ============================================================
  publicar:
    needs: [radar-png, acumulacions]
    if: |
      needs.radar-png.outputs.files_ok == 'true' &&
      needs.acumulacions.outputs.files_ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    concurrency:
      group: radar-png-update
      cancel-in-progress: false

    steps:

      - name: Descarregar artifact radar-png
        uses: actions/download-artifact@v4
        with:
          name: dades-radar-png
          path: dades_png/

      - name: Descarregar artifact acumulacions
        uses: actions/download-artifact@v4
        with:
          name: dades-acumulacions
          path: dades_acum/

      - name: Verificar tots els fitxers abans de publicar
        run: |
          set -euo pipefail
          echo "=== radar-png ==="
          ls -la dades_png/ || echo "no existeix"

          for sub in dbz lluvia; do
            if [ -d "dades_png/$sub" ]; then
              if [ ! -s "dades_png/$sub/manifest.json" ]; then
                echo "::error::Falta dades_png/$sub/manifest.json"
                exit 1
              fi
              n=$(find "dades_png/$sub" -maxdepth 1 -name "*.png" | wc -l)
              echo "  $sub: $n PNGs"
            fi
          done

          echo "=== acumulacions ==="
          ls -la dades_acum/ || echo "no existeix"
          if [ ! -s "dades_acum/manifest.json" ]; then
            echo "::error::Falta dades_acum/manifest.json"
            exit 1
          fi
          n=$(find dades_acum -maxdepth 1 -name "*.png" | wc -l)
          echo "  acumulacions: $n PNGs"

          echo "OK: verificació prèvia correcta"

      - name: Pujar a R2 (dBZ + NIMBUS + Acumulacions)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          upload_one() {
            local f="$1"; local ct="$2"; local dest="$3"
            local attempt=1
            while [ "$attempt" -le 3 ]; do
              echo "Pujant ($attempt/3): $dest"
              if npx wrangler r2 object put "$dest" \
                   --file="$f" --remote --content-type="$ct"; then
                return 0
              fi
              echo "Fallada pujant $dest, reintentant..."
              attempt=$((attempt + 1))
              sleep 3
            done
            return 1
          }

          fail_count=0

          upload_dir() {
            local src_dir="$1"
            local r2_prefix="$2"

            if [ ! -d "$src_dir" ]; then
              echo "AVIS: no existeix $src_dir, salto"
              return
            fi

            cd "$src_dir"

            # Neteja si cal
            if [ -f .neteja ]; then
              echo "→ esborrant prefix $r2_prefix"
              npx wrangler r2 object delete --recursive \
                "$R2_BUCKET/$r2_prefix" --remote || true
              rm -f .neteja
            fi

            # Pugem PNGs
            for f in *.png; do
              [ -f "$f" ] || continue
              upload_one "$f" "image/png" "${R2_BUCKET}/${r2_prefix}$f" \
                || fail_count=$((fail_count + 1))
            done

            # Pugem manifest
            if [ -f manifest.json ]; then
              upload_one "manifest.json" "application/json" \
                "${R2_BUCKET}/${r2_prefix}manifest.json" \
                || fail_count=$((fail_count + 1))
            fi

            cd - > /dev/null
          }

          # -------------------------------------------------
          # 1) DBZ
          # -------------------------------------------------
          upload_dir "dades_png/dbz" "$R2_PREFIX"

          # -------------------------------------------------
          # 2) NIMBUS
          # -------------------------------------------------
          upload_dir "dades_png/lluvia" "$R2_PREFIX_NIMBUS"

          # -------------------------------------------------
          # 3) ACUMULACIONS
          # -------------------------------------------------
          upload_dir "dades_acum" "$R2_PREFIX_ACUM"

          # -------------------------------------------------
          # RESULTAT
          # -------------------------------------------------
          if [ "$fail_count" -gt 0 ]; then
            echo "::error::$fail_count fitxers no s'han pogut pujar a R2"
            exit 1
          fi

          echo "OK: dBZ + NIMBUS + Acumulacions pujats a R2."