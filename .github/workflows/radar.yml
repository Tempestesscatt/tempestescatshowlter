name: Actualitza dades radar
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  actualitzar-dades:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: radar-update
      cancel-in-progress: true
    steps:
      - name: Clonar repositori
        uses: actions/checkout@v4
      - name: Crear carpetes de dades
        run: |
          mkdir -p radar/public/radar
          mkdir -p radar/public/radar_nimbus
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instal·lar dependències del sistema (HDF5)
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev
      - name: Instal·lar dependències de Python
        run: |
          python -m pip install --upgrade pip
          pip install requests h5py numpy pyproj
      - name: Executar CIRRUS i NIMBUS en paral·lel
        env:
          METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          cd radar

          echo "Llançant radar.py (CIRRUS) i radar_nimbus.py (NIMBUS) en paral·lel..."

          python -u radar.py > cirrus.log 2>&1 &
          pid_cirrus=$!

          python -u radar_nimbus.py > nimbus.log 2>&1 &
          pid_nimbus=$!

          # S'espera cada procés per separat per poder recollir el seu
          # codi de sortida individual, encara que ja s'hagin executat
          # en paral·lel (wait no bloqueja el segon fins que el primer
          # acaba, nomes serveix per llegir l'exit code de cadascun).
          wait "$pid_cirrus"
          exit_cirrus=$?

          wait "$pid_nimbus"
          exit_nimbus=$?

          echo "--- LOG CIRRUS ---"
          cat cirrus.log
          echo "--- LOG NIMBUS ---"
          cat nimbus.log

          echo ""
          echo "Codi sortida CIRRUS: $exit_cirrus"
          echo "Codi sortida NIMBUS: $exit_nimbus"

          # Es guarda l'estat per poder decidir mes tard si cal fallar
          # el job, sense tallar aqui la pujada a R2 del producte que
          # si que ha funcionat.
          echo "exit_cirrus=$exit_cirrus" >> "$GITHUB_ENV"
          echo "exit_nimbus=$exit_nimbus" >> "$GITHUB_ENV"
      - name: Mostrar contingut generat
        run: |
          echo "--- public/radar ---"
          ls -la radar/public/radar/ 2>/dev/null || echo "buit"
          echo "--- public/radar_nimbus ---"
          ls -la radar/public/radar_nimbus/ 2>/dev/null || echo "buit"
      - name: Pujar dades a R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e  # no abortar tot el step si una comanda falla; ho gestionem nosaltres
          failed_files=()
          upload_with_retry() {
            local file="$1"
            local key="$2"
            local max_attempts=5
            local attempt=1
            local delay=3
            while [ "$attempt" -le "$max_attempts" ]; do
              echo "Pujant $key (intent $attempt/$max_attempts)..."
              if npx wrangler r2 object put "$key" \
                  --file="$file" --remote --content-type="application/javascript"; then
                echo "OK: $key"
                return 0
              fi
              echo "Fallada intent $attempt per $key. Reintentant en ${delay}s..."
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))  # backoff exponencial: 3s, 6s, 12s, 24s
            done
            echo "ERROR DEFINITIU: no s'ha pogut pujar $key després de $max_attempts intents"
            return 1
          }

          # CIRRUS
          for f in radar/public/radar/*.js; do
            [ -e "$f" ] || continue
            key="tempestes-radar-data/radar/$(basename "$f")"
            if ! upload_with_retry "$f" "$key"; then
              failed_files+=("$key")
            fi
          done

          # NIMBUS
          for f in radar/public/radar_nimbus/*.js; do
            [ -e "$f" ] || continue
            key="tempestes-radar-data/radar_nimbus/$(basename "$f")"
            if ! upload_with_retry "$f" "$key"; then
              failed_files+=("$key")
            fi
          done

          if [ "${#failed_files[@]}" -gt 0 ]; then
            echo ""
            echo "Fitxers que NO s'han pogut pujar (${#failed_files[@]}):"
            printf ' - %s\n' "${failed_files[@]}"
            exit 1
          fi
          echo "Totes les pujades han tingut èxit."
      - name: Comprovar resultat de CIRRUS i NIMBUS
        run: |
          fallat=0
          if [ "$exit_cirrus" != "0" ]; then
            echo "CIRRUS ha fallat (exit $exit_cirrus)"
            fallat=1
          fi
          if [ "$exit_nimbus" != "0" ]; then
            echo "NIMBUS ha fallat (exit $exit_nimbus)"
            fallat=1
          fi
          if [ "$fallat" = "1" ]; then
            exit 1
          fi
          echo "CIRRUS i NIMBUS OK."
