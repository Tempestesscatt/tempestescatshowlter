      - name: Baixar estat actual de R2 (ULTRA-RÀPID)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Instal·lar rclone
          curl -sO https://downloads.rclone.org/rclone-current-linux-amd64.deb
          sudo dpkg -i rclone-current-linux-amd64.deb > /dev/null 2>&1
          
          # Configuració mínima
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${CLOUDFLARE_ACCOUNT_ID}
          secret_access_key = ${CLOUDFLARE_API_TOKEN}
          endpoint = https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com
          acl = private
          no_check_bucket = true
          EOF
          
          cd radar/public/radar
          
          # Descàrrega MÀXIMA velocitat: 32 fils, sense verificacions
          rclone copy r2:${R2_BUCKET}/${R2_PREFIX} . \
            --transfers 32 \
            --checkers 64 \
            --multi-thread-streams 8 \
            --fast-list \
            --no-traverse \
            --no-check-certificate \
            --size-only \
            --ignore-times \
            --retries 1 \
            --low-level-retries 1 \
            --no-gzip-encoding \
            --buffer-size 256M \
            --progress \
            -v
          
          echo "--- Baixat: $(ls -1 | wc -l) fitxers ---"
