name: Actualitza dades radar

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  R2_BUCKET: tempestes-radar-data
  R2_PREFIX: radar/

jobs:
  actualitzar-dades:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: radar-update
      cancel-in-progress: true

    steps:
      - name: Clonar repositori
        uses: actions/checkout@v4

      - name: Crear carpetes de dades
        run: |
          mkdir -p radar/public/radar

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instal·lar dependències del sistema (HDF5)
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev

      - name: Instal·lar dependències de Python
        run: |
          python -m pip install --upgrade pip
          pip install requests h5py numpy pyproj

      # ─────────────────────────────────────────────────────────────
      # PURGA TOTAL: esborra TOT el contingut existent a R2 sota el
      # prefix radar/ (frames .js i .json d'estat inclosos).
      #
      # Fem servir l'API S3-compatible de R2 (aws-cli) en comptes de
      # l'API REST v4 de Cloudflare: l'endpoint DELETE de v4 no
      # accepta batch delete amb un body {"keys": [...]} (dona
      # HTTP 400 "JSON not well formed"). "aws s3 rm --recursive" és
      # el metode oficialment suportat per esborrar en massa i gestiona
      # ell mateix el batching intern (fins a 1000 objectes/crida) i
      # la paginacio.
      #
      # Necessita credencials R2 en format S3 (Access Key ID + Secret
      # Access Key), NO el CLOUDFLARE_API_TOKEN de la REST API v4.
      # Es generen a: R2 -> Manage API Tokens -> Create API Token,
      # amb permisos "Object Read & Write" sobre aquest bucket.
      # ─────────────────────────────────────────────────────────────
      - name: Purgar TOT el contingut de R2 (S3 API)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e

          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"

          echo "Comptant objectes abans de purgar..."
          aws s3 ls "s3://${R2_BUCKET}/${R2_PREFIX}" --recursive --endpoint-url "$ENDPOINT" | wc -l || true

          echo "Purgant s3://${R2_BUCKET}/${R2_PREFIX} ..."
          aws s3 rm "s3://${R2_BUCKET}/${R2_PREFIX}" --recursive --endpoint-url "$ENDPOINT"

          echo "=== Purga completada ==="
          echo "Comprovant que ha quedat buit..."
          aws s3 ls "s3://${R2_BUCKET}/${R2_PREFIX}" --recursive --endpoint-url "$ENDPOINT" || echo "(buit, com s'esperava)"

      - name: Executar radar.py (CIRRUS / dBZ + NIMBUS / mm)
        env:
          METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          cd radar
          python -u radar.py

      - name: Mostrar contingut generat
        run: |
          echo "--- public/radar (despres d'executar radar.py) ---"
          ls -la radar/public/radar/ 2>/dev/null || echo "buit"

      - name: Pujar dades a R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for f in radar/public/radar/*.js radar/public/radar/*.json; do
            [ -e "$f" ] || continue
            nom="$(basename "$f")"
            case "$nom" in
              *.json) content_type="application/json" ;;
              *) content_type="application/javascript" ;;
            esac
            npx wrangler r2 object put "${R2_BUCKET}/${R2_PREFIX}${nom}" \
              --file="$f" --remote --content-type="$content_type"
          done
