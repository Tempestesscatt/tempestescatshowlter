name: Descarga AROME SFC + Geo/Vent 500hPa

on:
  workflow_dispatch: {}
  schedule:
    - cron: '*/30 * * * *'  # Cada 30 minuts

permissions:
  contents: read

env:
  R2_BUCKET: tempestes-radar-data
  R2_PREFIX_SFC: dades_sfc/
  MIN_FITXERS_SFC: 10

jobs:
  superficie:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      files_ok: ${{ steps.verify.outputs.files_ok }}

    steps:
      - name: Clonar repositori (sense submòduls)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Configurar clau SSH per al submòdul privat
        env:
          DEPLOY_KEY_B64: ${{ secrets.SUBMODULE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$DEPLOY_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config --global core.sshCommand "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -T git@github.com || true

      - name: Inicialitzar submòdul privat (scripts-privats)
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth=1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instal·lar dependències
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y libeccodes-dev libeccodes0
          pip install meteofetch cfgrib scipy "numpy<2.3" requests msgpack-python
          pip check || true
          python -c "import cfgrib; print('cfgrib OK')"

      - name: Preparar directoris de sortida
        run: |
          set -euo pipefail
          mkdir -p scripts-privats/radar/public/dades_sfc
          mkdir -p radar/public/dades_sfc

      - name: Executar sfc.py amb --now
        id: run_sfc
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
          # Força la ruta de sortida via variable d'entorn: sfc.py li dona
          # prioritat per sobre de "output_dir" del config.json/configNE.json
          # i del fallback de Windows hardcodejat. Així no cal editar el JSON
          # del submòdul amb sed.
          SFC_OUTPUT_DIR: ${{ github.workspace }}/scripts-privats/radar/public/dades_sfc
        run: |
          set -euo pipefail
          echo "Executant sfc.py des de scripts-privats/"
          cd scripts-privats
          python -X faulthandler sfc.py --now
        continue-on-error: true

      - name: Localitzar fitxers SFC generats
        id: locate
        run: |
          set -euo pipefail
          echo "=== BUSCANT FITXERS SFC GENERATS ==="
          
          # Buscar en ubicacions específiques
          echo "1. scripts-privats/radar/public/dades_sfc:"
          ls -la scripts-privats/radar/public/dades_sfc/ 2>/dev/null | grep "sfc_" || echo "  Buit"
          
          echo ""
          echo "2. radar/public/dades_sfc:"
          ls -la radar/public/dades_sfc/ 2>/dev/null | grep "sfc_" || echo "  Buit"
          
          echo ""
          echo "3. Buscant a tot el repositori:"
          find . -name "sfc_*.msgpack.gz" -type f -exec ls -lh {} \; 2>/dev/null || echo "  No trobats"
          
          echo ""
          echo "4. Buscant a tot el sistema:"
          find /home/runner/work -name "sfc_*.msgpack.gz" -type f -exec ls -lh {} \; 2>/dev/null | head -20 || echo "  No trobats"

      - name: Verificar que els fitxers generats són complets i vàlids
        id: verify
        run: |
          set -euo pipefail
          
          n_valids=0
          
          # Verificar primera ubicació
          if [ -d "scripts-privats/radar/public/dades_sfc" ]; then
            for f in scripts-privats/radar/public/dades_sfc/sfc_*.msgpack.gz; do
              [ -f "$f" ] || continue
              if [ -s "$f" ]; then
                n_valids=$((n_valids + 1))
              fi
            done
          fi
          
          # Verificar segona ubicació
          if [ -d "radar/public/dades_sfc" ]; then
            for f in radar/public/dades_sfc/sfc_*.msgpack.gz; do
              [ -f "$f" ] || continue
              if [ -s "$f" ]; then
                n_valids=$((n_valids + 1))
              fi
            done
          fi
          
          # Si no s'han trobat a les ubicacions conegudes, buscar a tot arreu
          if [ "$n_valids" -eq 0 ]; then
            n_valids=$(find /home/runner/work -name "sfc_*.msgpack.gz" -size +0c -type f 2>/dev/null | wc -l)
          fi
          
          echo "Fitxers sfc_*.msgpack.gz vàlids trobats: $n_valids (mínim requerit: $MIN_FITXERS_SFC)"
          
          if [ "$n_valids" -lt "$MIN_FITXERS_SFC" ]; then
            echo "ERROR: només s'han generat $n_valids fitxers vàlids, per sota del mínim ($MIN_FITXERS_SFC)."
            echo "files_ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "OK: $n_valids fitxers presents i amb contingut"
            echo "files_ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Marcar job com a fallit si falten dades
        if: steps.verify.outputs.files_ok != 'true'
        run: |
          echo "::error::Cicle SFC incomplet: no es publicarà a R2."
          exit 1

      - name: Preparar fitxers per pujar
        if: steps.verify.outputs.files_ok == 'true'
        run: |
          set -euo pipefail
          mkdir -p dades_sfc_final
          
          # Copiar des de totes les ubicacions possibles
          if [ -d "scripts-privats/radar/public/dades_sfc" ]; then
            cp scripts-privats/radar/public/dades_sfc/sfc_*.msgpack.gz dades_sfc_final/ 2>/dev/null || true
          fi
          
          if [ -d "radar/public/dades_sfc" ]; then
            cp radar/public/dades_sfc/sfc_*.msgpack.gz dades_sfc_final/ 2>/dev/null || true
          fi
          
          # Si no hi ha fitxers a les ubicacions conegudes, buscar a tot arreu
          if [ -z "$(ls -A dades_sfc_final/ 2>/dev/null)" ]; then
            find /home/runner/work -name "sfc_*.msgpack.gz" -type f -size +0c -exec cp {} dades_sfc_final/ \; 2>/dev/null || true
          fi
          
          echo "Fitxers preparats per pujar:"
          ls -la dades_sfc_final/
          
          # Verificar que hi ha fitxers
          n_files=$(ls dades_sfc_final/sfc_*.msgpack.gz 2>/dev/null | wc -l)
          if [ "$n_files" -eq 0 ]; then
            echo "::error::No s'han trobat fitxers per pujar"
            exit 1
          fi
          
          echo "Total fitxers a pujar: $n_files"

      - name: Pujar resultat com a artifact
        if: steps.verify.outputs.files_ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dades-sfc
          path: dades_sfc_final/
          retention-days: 1
          if-no-files-found: error

  publicar:
    needs: [superficie]
    if: needs.superficie.outputs.files_ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: sfc-update
      cancel-in-progress: false

    steps:
      - name: Descarregar artifact SFC
        uses: actions/download-artifact@v4
        with:
          name: dades-sfc
          path: dades_sfc/

      - name: Verificar altre cop abans de publicar
        run: |
          set -euo pipefail
          cd dades_sfc
          n_valids=$(ls sfc_*.msgpack.gz 2>/dev/null | wc -l)
          echo "Fitxers vàlids just abans de publicar: $n_valids"
          if [ "$n_valids" -lt "$MIN_FITXERS_SFC" ]; then
            echo "::error::Nombre de fitxers per sota del mínim. Avortant."
            exit 1
          fi
          echo "OK: verificació prèvia a publicar correcta"

      - name: Pujar a R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          fail_count=0

          upload_one() {
            local f="$1"
            local ct="$2"
            local dest="$3"
            local attempt=1
            local max_attempts=3

            while [ "$attempt" -le "$max_attempts" ]; do
              echo "Pujant ($attempt/$max_attempts): $dest"
              if npx wrangler r2 object put "$dest" \
                   --file="$f" --remote --content-type="$ct"; then
                return 0
              fi
              echo "Fallada pujant $dest, reintentant..."
              attempt=$((attempt + 1))
              sleep 3
            done
            return 1
          }

          cd dades_sfc
          for f in sfc_*.msgpack.gz; do
            [ -f "$f" ] || continue
            if ! upload_one "$f" "application/octet-stream" "${R2_BUCKET}/${R2_PREFIX_SFC}$f"; then
              echo "ERROR: no s'ha pogut pujar $f després de tots els intents"
              fail_count=$((fail_count + 1))
            fi
          done

          if [ "$fail_count" -gt 0 ]; then
            echo "::error::$fail_count fitxer(s) no s'han pogut pujar a R2"
            exit 1
          fi

          echo "OK: dades SFC pujades a R2 correctament"
          
          echo ""
          echo "=== RESUM DE LA PUBLICACIÓ ==="
          echo "Bucket: $R2_BUCKET"
          echo "Prefix: $R2_PREFIX_SFC"
          echo "Fitxers publicats:"
          for f in sfc_*.msgpack.gz; do
            echo "  - $f"
          done